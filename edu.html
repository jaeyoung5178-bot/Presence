<style>
  :root{
    --bg:#0d0e12; --bg2:#14161c; --card:#1a1d25; --card2:#20242e;
    --ink:#f3efe6; --sub:#a7a294; --line:#2c313c; --line2:#3a4150;
    --accent:#8fd14f; --accent-d:#5c8f2e; --gold:#e8c877; --danger:#e06a6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #191c24 0%, var(--bg) 60%);
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px; margin:0 auto; padding:22px 18px 90px;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .back{color:var(--sub); text-decoration:none; font-size:14px; border:1px solid var(--line); padding:7px 12px; border-radius:999px; transition:.15s;}
  .back:hover{color:var(--ink); border-color:var(--line2);}
  h1{font-size:26px; margin:14px 0 2px; letter-spacing:-.5px;}
  h1 .em{color:var(--accent);}
  .lead{color:var(--sub); font-size:14px; margin:0 0 18px;}
  .kicker{font-size:12px; letter-spacing:3px; color:var(--gold); font-weight:700;}

  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:14px 0 12px;}
  .folders{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    background:var(--card); border:1px solid var(--line); color:var(--sub);
    padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600; transition:.15s;
  }
  .chip:hover{border-color:var(--line2); color:var(--ink);}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-d)); color:#0d0e12; border-color:transparent;}
  .chip .cnt{font-size:11px; opacity:.7;}
  .chip .fx{color:var(--danger); font-weight:800; margin-left:2px; display:none;}
  .editing .chip .fx{display:inline;}
  .chip.addf{border-style:dashed; color:var(--accent);}
  .chip.wepair-tab{color:var(--gold); border-color:rgba(232,200,119,.42);}
  .chip.wepair-tab:hover{color:#fff3cd; border-color:var(--gold);}
  .chip.wepair-tab.on{background:linear-gradient(135deg,#f0d78c,#c79b38); color:#14120b; border-color:transparent;}

  .adminbtn{background:var(--card); border:1px solid var(--line); color:var(--sub); padding:9px 14px; border-radius:999px; font-size:13px; cursor:pointer; transition:.15s;}
  .adminbtn:hover{color:var(--ink); border-color:var(--line2);}
  .adminbtn.on{color:var(--gold); border-color:var(--gold);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:6px;}
  .item{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px 16px 15px; text-decoration:none; color:var(--ink); display:block; transition:.15s; overflow:hidden; cursor:pointer;
  }
  .item:hover{transform:translateY(-2px); border-color:var(--line2); background:var(--card2);}
  .item .tg{display:inline-block; font-size:11px; letter-spacing:1.5px; font-weight:800; color:var(--accent); border:1px solid var(--line2); border-radius:6px; padding:3px 8px; margin-bottom:9px;}
  .item .ti{font-size:16px; font-weight:700; margin:0 0 4px; letter-spacing:-.3px;}
  .item .title-edit{display:none; width:100%; margin:0 0 7px; background:var(--bg2); color:var(--ink); border:1px solid var(--line2); border-radius:8px; padding:8px 9px; font:inherit; font-size:15px; font-weight:700; letter-spacing:-.3px;}
  .item .title-edit:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(143,209,79,.12);}
  .item .rename-hint{display:none; margin:-1px 0 8px; color:var(--accent); font-size:11px; font-weight:600;}
  .editing .item .ti{display:none;}
  .editing .item .title-edit,.editing .item .rename-hint{display:block;}
  .item .su{font-size:13px; color:var(--sub); line-height:1.45; margin:0;}
  .item .arw{position:absolute; right:14px; top:15px; color:var(--sub); opacity:0; transition:.15s;}
  .item:hover .arw{opacity:1; right:12px;}
  .item .xdel{position:absolute; right:8px; top:8px; width:24px; height:24px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-weight:800; cursor:pointer; display:none; align-items:center; justify-content:center; line-height:1;}
  .editing .item .xdel{display:flex;}
  .item .mv{display:none; margin-top:10px;}
  .editing .item .mv{display:block;}
  .item .mv label{display:block; font-size:11px; color:var(--sub); margin-bottom:4px; letter-spacing:.2px;}
  .item .mv select{width:100%; background:var(--bg2); color:var(--ink); border:1px solid var(--line2); border-radius:8px; padding:7px 8px; font-size:12px; cursor:pointer;}

  .empty{grid-column:1/-1; text-align:center; color:var(--sub); padding:40px 10px; font-size:14px;}
  .additem{border:1px dashed var(--line2); background:transparent; color:var(--accent); border-radius:16px; padding:16px; font-size:14px; cursor:pointer; display:none; align-items:center; justify-content:center; min-height:90px;}
  .editing .additem{display:flex;}

  .wepair-panel{grid-column:1/-1; border:1px solid var(--line2); border-radius:20px; background:var(--card); overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.25);}
  .wepair-head{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 18px; border-bottom:1px solid var(--line); background:linear-gradient(135deg,rgba(232,200,119,.10),rgba(143,209,79,.06));}
  .wepair-title{display:flex; align-items:center; gap:12px; min-width:0;}
  .wepair-mark{display:grid; place-items:center; flex:0 0 auto; width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,#f0d78c,#b6872d); color:#14120b; font-size:20px; box-shadow:0 8px 22px rgba(232,200,119,.18);}
  .wepair-title strong{display:block; font-size:16px; letter-spacing:-.2px;}
  .wepair-title span{display:block; margin-top:3px; color:var(--sub); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .wepair-open{flex:0 0 auto; color:var(--ink); text-decoration:none; border:1px solid var(--line2); border-radius:999px; padding:9px 13px; font-size:12px; font-weight:700; transition:.15s;}
  .wepair-open:hover{color:var(--gold); border-color:var(--gold);}
  .wepair-frame-wrap{position:relative; width:100%; height:clamp(560px,78vh,980px); background:#08090c;}
  .wepair-frame{display:block; width:100%; height:100%; border:0; background:#08090c;}

  /* modal */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:18px; z-index:50;}
  .mask.on{display:flex;}
  .modal{background:var(--bg2); border:1px solid var(--line2); border-radius:18px; width:100%; max-width:400px; padding:20px;}
  .modal h3{margin:0 0 14px; font-size:17px;}
  .fld{margin-bottom:11px;}
  .fld label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px;}
  .fld input,.fld select{width:100%; background:var(--card); color:var(--ink); border:1px solid var(--line2); border-radius:9px; padding:10px 11px; font-size:14px; font-family:inherit;}
  .row2{display:flex; gap:9px;}
  .row2>*{flex:1;}
  .chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); cursor:pointer;}
  .mbtns{display:flex; gap:9px; margin-top:16px;}
  .mbtns button{flex:1; padding:11px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; border:none;}
  .b-ok{background:linear-gradient(135deg,var(--accent),var(--accent-d)); color:#0d0e12;}
  .b-cc{background:var(--card); color:var(--sub); border:1px solid var(--line2)!important;}
  .save-toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--accent); color:#0d0e12; padding:10px 20px; border-radius:999px; font-weight:700; font-size:13px; opacity:0; transition:.3s; pointer-events:none; z-index:60;}
  .save-toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  @media(max-width:1024px){
    .back,.adminbtn,.chip,.mbtns button{min-height:44px;}
  }
  @media(max-width:560px){ .grid{grid-template-columns:1fr 1fr;} .item .ti{font-size:15px;} h1{font-size:22px;} .wepair-head{align-items:flex-start; padding:14px;} .wepair-title span{white-space:normal;} .wepair-open{padding:8px 10px;} .wepair-frame-wrap{height:72vh; min-height:520px;} }
  @media(max-width:560px){ .item .title-edit,.fld input,.fld select{font-size:16px;min-height:44px;} }
  @media(max-width:400px){ .grid{grid-template-columns:1fr;} }
</style>
</head>

<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← 허브</a>

  </div>

    <div class="folders" id="folders"></div>

  <div class="grid" id="grid"></div>

<!-- add/edit item modal -->
<div class="mask" id="itemMask">
  <div class="modal">
    <h3 id="itemModalTitle">자료 추가</h3>
    <div class="fld"><label>제목</label><input id="fTitle" placeholder="예: Objection Handling"></div>

    <div class="row2">
      <div class="fld"><label>태그</label><input id="fTag" placeholder="예: HANDLE" maxlength="10"></div>

    </div>
    <div class="fld"><label>링크 주소</label><input id="fHref" placeholder="예: 토픽/topic-xxx.html 또는 https://..."></div>
    <label class="chk"><input type="checkbox" id="fBlank"> 새 탭에서 열기</label>
    <div class="mbtns"><button class="b-cc" id="itemCancel">취소</button><button class="b-ok" id="itemSave">저장</button></div>
  </div>
</div>

<div class="save-toast" id="toast">저장됨 ✓</div>

  var data = null;         // {v,folders,items}
  var LOCAL_KEY = "presence.edu.library.v2";
  var WEPAIR_VIEW = "__WEPAIR__";
  var WEPAIR_URL = "https://jaeyoung5178-bot.github.io/wepair-presentation/";
  var active = new URLSearchParams(location.search).get("tab") === "wepair" ? WEPAIR_VIEW : "__ALL__";  // current folder filter

  // PRESENCE 기본 교육 자료: 원격 목록 상태와 관계없이 항상 노출합니다.
  function ensureCallbackGuide(d){
    if(!d || !d.items) return d;
    var found=d.items.some(function(it){ return it.href==="call-back-sheet-guide.html" || it.title==="Call Back Sheet 작성법"; });
    if(!found){
      d.items.unshift({
        id:"presence-callback-guide",

        href:"call-back-sheet-guide.html",
        target:"",
        folder:"신입"
      });
    }
    return d;
  }

  // 기존 핸들링 자료와 별도로, 니즈파악 중심의 발표형 교육 자료를 유지합니다.
  function ensureNeedsObjectionGuide(d){
    if(!d || !d.items) return false;

    if(found) return false;

  }

  }

  // My Story 발표는 에듀케이션의 고정 탭으로 모든 기기에서 항상 노출합니다.
  function ensureMyStoryGuide(d){
    if(!d || !Array.isArray(d.folders) || !Array.isArray(d.items)) return false;

    if(d.folders.indexOf("마이스토리")<0){

  function toast(msg){ var t=$("#toast"); t.textContent=msg||"저장됨 ✓"; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("on");},1400); }
  function titleStorageKey(it){
    // href는 새로고침 뒤에도 바뀌지 않으므로 랜덤 생성 id보다 우선합니다.
    return "presence.edu.title."+(it.href ? "href."+it.href : "id."+(it.id||it.title));
  }
  function legacyTitleStorageKey(it){ return "presence.edu.title."+(it.id||it.href||it.title); }
  function restoreLocalTitles(d){
    if(!d || !d.items) return d;
    d.items.forEach(function(it){
      var saved=localStorage.getItem(titleStorageKey(it)) || localStorage.getItem(legacyTitleStorageKey(it));
      if(saved) it.title=saved;
    });
    return d;
  }

  function validData(d){ return !!(d && Array.isArray(d.folders) && Array.isArray(d.items)); }
  function readLocalData(){
    try{
      var d=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");
      return validData(d) ? restoreLocalTitles(ensureCallbackGuide(d)) : null;
    }catch(e){ return null; }
  }
  function writeLocalData(){
    if(!validData(data)) return false;
    try{ localStorage.setItem(LOCAL_KEY,JSON.stringify(data)); return true; }
    catch(e){ return false; }
  }

  function firebaseRuntime(){
    if(firebaseRuntimePromise) return firebaseRuntimePromise;
    firebaseRuntimePromise=Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js")
    ]).then(function(mods){
      var appApi=mods[0], authApi=mods[1], dbApi=mods[2];
      var app=appApi.getApps().length ? appApi.getApp() : appApi.initializeApp(FIREBASE_CONFIG);
      return {authApi:authApi,dbApi:dbApi,auth:authApi.getAuth(app),db:dbApi.getDatabase(app)};
    });
    return firebaseRuntimePromise;
  }

  function remoteSave(payload){
    return firebaseRuntime().then(function(fb){
      var ready=typeof fb.auth.authStateReady==="function" ? fb.auth.authStateReady() : Promise.resolve();
      return ready.then(function(){
        return fb.auth.currentUser ? fb.auth.currentUser : fb.authApi.signInAnonymously(fb.auth).then(function(c){return c.user;});
      }).then(function(user){
        return fb.dbApi.set(fb.dbApi.ref(fb.db,"eduAdminProofs/"+user.uid),ADMIN_PROOF).then(function(){
          return fb.dbApi.set(fb.dbApi.ref(fb.db,"edu_lib"),payload);
        });
      });
    });
  }

  function load(){
    var local=readLocalData();
    if(local){
      data=local;
      var localChanged=ensureNeedsObjectionGuide(data);
      localChanged=ensureFieldRookieGuide(data)||localChanged;
      localChanged=ensureMyStoryGuide(data) || localChanged;
      if(localChanged) writeLocalData();
      render();
    }
    fetch(DB+NODE+"?x="+Date.now(),{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("remote load "+r.status);
      return r.json();
    }).then(function(j){
      if(validData(j) && (!local || Number(j.updatedAt||0)>Number(local.updatedAt||0))){
        data=restoreLocalTitles(ensureCallbackGuide(j));
        var remoteChanged=ensureNeedsObjectionGuide(data);
        remoteChanged=ensureFieldRookieGuide(data)||remoteChanged;
        remoteChanged=ensureMyStoryGuide(data) || remoteChanged;
        if(remoteChanged) save(true);
        else writeLocalData();
        render();
      }
      else if(!data){
        data=restoreLocalTitles(ensureCallbackGuide(JSON.parse(JSON.stringify(SEED))));
        ensureNeedsObjectionGuide(data); ensureFieldRookieGuide(data); ensureMyStoryGuide(data); save(true); render();
      }
    }).catch(function(){
      if(data) return;
      data=restoreLocalTitles(ensureCallbackGuide(JSON.parse(JSON.stringify(SEED))));
      ensureNeedsObjectionGuide(data); ensureFieldRookieGuide(data); ensureMyStoryGuide(data); save(true); render();
    });
  }
  function save(silent){
    if(!data) return;
    data.updatedAt=Date.now();
    var localSaved=writeLocalData();
    if(!silent) toast(localSaved ? "저장 중…" : "기기 저장 공간이 부족해요");
    remoteSave(JSON.parse(JSON.stringify(data))).then(function(){
      if(!silent) toast("전체 기기에 저장됨 ✓");
    }).catch(function(err){
      console.error("교육 자료 서버 저장 실패",err);
      if(!silent) toast(localSaved ? "이 기기에만 저장됨 · 서버 연결 확인" : "저장하지 못했어요");
    });
  }

  function countIn(f){ return data.items.filter(function(it){return it.folder===f;}).length; }

  function render(){
    if(!data) return;
    document.body.classList.toggle("editing", isAdmin);
    // folders
    var fh = '<div class="chip '+(active==="__ALL__"?"on":"")+'" data-f="__ALL__">전체 <span class="cnt">'+data.items.length+'</span></div>';
    fh += '<div class="chip wepair-tab '+(active===WEPAIR_VIEW?"on":"")+'" data-f="'+WEPAIR_VIEW+'">✦ 위페어</div>';
    data.folders.forEach(function(f){
      fh += '<div class="chip '+(active===f?"on":"")+'" data-f="'+esc(f)+'">'+esc(f)+' <span class="cnt">'+countIn(f)+'</span><span class="fx" data-del="'+esc(f)+'">×</span></div>';
    });
    if(isAdmin){ fh += '<div class="chip addf" id="addFolder">＋ 폴더</div>'; }
    $("#folders").innerHTML = fh;

    // items
    if(active===WEPAIR_VIEW){
      $("#grid").innerHTML = '<section class="wepair-panel" aria-label="위페어 프레젠테이션">'
        + '<div class="wepair-head">'
        + '<div class="wepair-title"><span class="wepair-mark">W</span><div><strong>위페어 프레젠테이션</strong><span>교육 화면을 이 페이지 안에서 바로 확인할 수 있어요.</span></div></div>'
        + '<a class="wepair-open" href="'+WEPAIR_URL+'" target="_blank" rel="noopener">크게 보기 ↗</a>'
        + '</div>'
        + '<div class="wepair-frame-wrap"><iframe class="wepair-frame" src="'+WEPAIR_URL+'" title="위페어 프레젠테이션" loading="eager" allow="fullscreen" allowfullscreen></iframe></div>'
        + '</section>';
      return;
    }

    var list = data.items.filter(function(it){ return active==="__ALL__" || it.folder===active; });
    var gh = "";
    if(list.length===0){ gh = '<div class="empty">아직 자료가 없어요.'+(isAdmin?' 아래 ＋로 추가하세요.':'')+'</div>'; }
    list.forEach(function(it){
      var opts = data.folders.map(function(f){ return '<option value="'+esc(f)+'" '+(f===it.folder?"selected":"")+'>'+esc(f)+'</option>'; }).join("");
      gh += '<div class="item" data-href="'+esc(it.href||"#")+'" data-target="'+esc(it.target||"")+'" data-id="'+it.id+'">'
          + '<button class="xdel" data-xdel="'+it.id+'" title="삭제">×</button>'
          + '<span class="tg">'+esc(it.tag||"자료")+'</span>'
          + '<p class="ti">'+esc(it.title||"")+'</p>'
          + '<input class="title-edit" data-title-edit="'+it.id+'" value="'+esc(it.title||"")+'" aria-label="자료 제목" title="제목을 바꾸고 Enter를 누르세요">'
          + '<div class="rename-hint">제목 수정 후 Enter 또는 바깥을 누르면 저장됩니다.</div>'
          + '<p class="su">'+esc(it.sub||"")+'</p>'
          + '<span class="arw">→</span>'
          + '<div class="mv"><label>폴더 이동</label><select data-mv="'+it.id+'">'+opts+'</select></div>'
          + '</div>';
    });
    if(isAdmin){ gh += '<div class="additem" id="addItem">＋ 자료 추가</div>'; }
    $("#grid").innerHTML = gh;
  }

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  // ---- events (delegated) ----
  $("#folders").addEventListener("click", function(e){
    var del = e.target.closest("[data-del]");
    if(del){ e.stopPropagation(); var f=del.getAttribute("data-del");
      if(confirm('"'+f+'" 폴더를 삭제할까요? (안의 자료는 유지되지만 미분류가 됩니다)')){
        data.folders = data.folders.filter(function(x){return x!==f;});
        data.items.forEach(function(it){ if(it.folder===f) it.folder="미분류"; });
        if(data.items.some(function(it){return it.folder==="미분류";}) && data.folders.indexOf("미분류")<0) data.folders.push("미분류");
        if(active===f) active="__ALL__";
        save(); render();
      }
      return;
    }
    if(e.target.id==="addFolder"){
      var n=(prompt("새 폴더 이름")||"").trim();
      if(n){ if(data.folders.indexOf(n)>=0){ alert("이미 있는 폴더예요."); return; } data.folders.push(n); save(); render(); }
      return;
    }
    var chip=e.target.closest(".chip[data-f]");
    if(chip){
      active=chip.getAttribute("data-f");
      var nextUrl = active===WEPAIR_VIEW ? "edu.html?tab=wepair" : "edu.html";
      history.replaceState(null,"",nextUrl);
      render();
    }
  });

  $("#grid").addEventListener("click", function(e){
    var x=e.target.closest("[data-xdel]");
    if(x){ e.preventDefault(); e.stopPropagation(); var id=x.getAttribute("data-xdel");
      if(confirm("이 자료를 삭제할까요?")){ data.items=data.items.filter(function(it){return it.id!==id;}); save(); render(); }
      return;
    }
    if(e.target.id==="addItem"){ e.preventDefault(); openItemModal(null); return; }
    // clicks inside edit controls must never navigate or open the detail editor
    if(e.target.closest(".mv") || e.target.closest(".title-edit")) return;
    var card=e.target.closest(".item[data-href]");
    if(!card) return;
    if(isAdmin){ openItemModal(card.getAttribute("data-id")); return; } // edit mode: tap card to edit
    var href=card.getAttribute("data-href")||"#";
    if(href && href!=="#"){
      if(card.getAttribute("data-target")==="_blank") window.open(href,"_blank","noopener");
      else window.location.href=href;
    }
  });
  $("#grid").addEventListener("change", function(e){
    var mv=e.target.closest("[data-mv]");
    if(mv){ var id=mv.getAttribute("data-mv"); var it=data.items.filter(function(x){return x.id===id;})[0]; if(it){ it.folder=mv.value; save(); render(); } }
  });
  function saveTitle(input){
    var id=input.getAttribute("data-title-edit"), title=input.value.trim();
    var it=data.items.filter(function(x){return x.id===id;})[0];
    if(!it) return;
    if(!title){ input.value=it.title||""; toast("제목은 비워둘 수 없어요."); return; }
    if(title===it.title) return;
    it.title=title; localStorage.setItem(titleStorageKey(it),title); save(); render();
  }
  $("#grid").addEventListener("keydown", function(e){
    var input=e.target.closest("[data-title-edit]");
    if(!input) return;
    if(e.key==="Enter"){ e.preventDefault(); input.blur(); }
    if(e.key==="Escape"){ e.preventDefault(); var it=data.items.filter(function(x){return x.id===input.getAttribute("data-title-edit");})[0]; input.value=it?it.title:""; input.blur(); }
  });
  $("#grid").addEventListener("focusout", function(e){
    var input=e.target.closest("[data-title-edit]");
    if(input) saveTitle(input);
  });

  // admin toggle
  $("#adminBtn").addEventListener("click", function(){
    if(isAdmin){ isAdmin=false; this.classList.remove("on"); this.textContent="🔒 관리자"; render(); return; }
    var pw=prompt("관리자 비밀번호");
    if(pw===ADMIN_PW){ isAdmin=true; this.classList.add("on"); this.textContent="✏️ 편집중 (누르면 종료)"; render(); }
    else if(pw!=null){ alert("비밀번호가 달라요."); }
  });

  // item modal
  function openItemModal(id){
    editingItemId=id;
    var it = id ? data.items.filter(function(x){return x.id===id;})[0] : null;
    $("#itemModalTitle").textContent = id ? "자료 편집" : "자료 추가";
    $("#fTitle").value = it?it.title:"";
    $("#fSub").value = it?it.sub:"";
    $("#fTag").value = it?it.tag:"";
    $("#fHref").value = it?it.href:"";
    $("#fBlank").checked = it? it.target==="_blank" : true;
    $("#fFolder").innerHTML = data.folders.map(function(f){ return '<option value="'+esc(f)+'" '+((it&&it.folder===f)||(!it&&f===(active==="__ALL__"?data.folders[0]:active))?"selected":"")+'>'+esc(f)+'</option>'; }).join("");
    $("#itemMask").classList.add("on");
  }
  $("#itemCancel").addEventListener("click", function(){ $("#itemMask").classList.remove("on"); });
  $("#itemMask").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("on"); });
  $("#itemSave").addEventListener("click", function(){
    var t=$("#fTitle").value.trim(); if(!t){ alert("제목을 입력하세요."); return; }
    var obj={ tag:$("#fTag").value.trim()||"자료", title:t, sub:$("#fSub").value.trim(), href:$("#fHref").value.trim(), target:$("#fBlank").checked?"_blank":"", folder:$("#fFolder").value };
    if(editingItemId){ var it=data.items.filter(function(x){return x.id===editingItemId;})[0]; if(it){ Object.assign(it,obj); localStorage.setItem(titleStorageKey(it),t); } }
    else { obj.id=uid(); data.items.push(obj); }
    $("#itemMask").classList.remove("on"); save(); render();
  });

  load();
})();
</script>
<script defer src="update-check.js"></script>
</body>
</html>
