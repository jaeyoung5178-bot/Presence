<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>월별 팀 리캡 · PRESENCE</title>
<link rel="icon" href="icon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#0d0e12;--bg2:#14161c;--card:#1a1d25;--card2:#20242e;--ink:#f3efe6;--sub:#a7a294;--line:#2c313c;--line2:#3a4150;--accent:#8fd14f;--gold:#e8c877;--blue:#5d8cff;--danger:#e06a6a}
*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:radial-gradient(1100px 620px at 50% -10%,#1c202a 0%,var(--bg) 62%);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}.hidden{display:none!important}button,input{font:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:28px 24px 90px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}.top a,.top button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub);font-size:13px;font-weight:750;text-decoration:none;cursor:pointer}.top a:hover,.top button:hover{border-color:var(--line2);color:var(--ink)}.top .studio{margin-left:auto;border-color:rgba(143,209,79,.45);color:var(--accent)}
.kicker{color:var(--gold);font-size:12px;font-weight:850;letter-spacing:.26em}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin:10px 0 28px}.hero h1{margin:0;font-size:clamp(34px,5vw,64px);letter-spacing:-.06em;line-height:1}.hero h1 span{color:var(--accent)}.hero p{max-width:590px;margin:13px 0 0;color:var(--sub);font-size:15px;line-height:1.65}.count{flex:0 0 auto;display:grid;place-items:center;width:112px;height:112px;border:1px solid var(--line2);border-radius:28px;background:linear-gradient(145deg,#20242e,#15171d);box-shadow:0 18px 42px rgba(0,0,0,.26)}.count b{font-size:38px;color:var(--accent);line-height:1}.count span{margin-top:-18px;color:var(--sub);font-size:11px;font-weight:750;letter-spacing:.12em}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{min-height:44px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub);font-size:14px;font-weight:750;cursor:pointer}.chip:hover{border-color:var(--line2);color:var(--ink)}.chip.on{border-color:transparent;background:linear-gradient(135deg,var(--accent),#5c8f2e);color:#0d0e12}.chip small{margin-left:5px;opacity:.68}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{position:relative;display:flex;min-height:245px;flex-direction:column;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--card),#171920);color:var(--ink);text-decoration:none;overflow:hidden;transition:.2s}.card:before{content:"";position:absolute;right:-70px;bottom:-90px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(93,140,255,.16),transparent 68%)}.card:hover{transform:translateY(-3px);border-color:#465064;background:linear-gradient(145deg,var(--card2),#191c24);box-shadow:0 20px 48px rgba(0,0,0,.28)}.card-head{display:flex;align-items:center;gap:8px}.tag{display:inline-flex;padding:4px 8px;border:1px solid var(--line2);border-radius:6px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.14em}.card time{color:var(--sub);font-size:11px}.arrow{margin-left:auto;color:var(--sub);font-size:18px;transition:.2s}.card:hover .arrow{color:var(--accent);transform:translateX(3px)}.card h2{margin:24px 0 8px;font-size:25px;letter-spacing:-.045em}.card p{margin:0;color:var(--sub);font-size:13px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:20px}.stat{min-width:0;padding:10px 9px;border:1px solid rgba(58,65,80,.75);border-radius:10px;background:rgba(13,14,18,.38)}.stat b{display:block;overflow:hidden;color:#fff;font-size:16px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.stat span{display:block;margin-top:4px;color:var(--sub);font-size:9px;font-weight:750;letter-spacing:.04em}.launch{display:flex;align-items:center;gap:7px;margin-top:13px;color:var(--gold);font-size:11px;font-weight:800}.launch i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(143,209,79,.55)}
.state{grid-column:1/-1;padding:54px 24px;border:1px dashed var(--line2);border-radius:18px;color:var(--sub);text-align:center;line-height:1.75}.state b{display:block;margin-bottom:7px;color:var(--ink);font-size:18px}.state a{color:var(--accent)}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);padding:28px;border:1px solid var(--line2);border-radius:24px;background:var(--card);box-shadow:0 22px 70px rgba(0,0,0,.45)}.login-card .kicker{font-size:10px}.login-card h1{margin:10px 0 6px;font-size:30px;letter-spacing:-.04em}.login-card p{margin:0 0 14px;color:var(--sub);font-size:13px;line-height:1.65}.login-card input{width:100%;min-height:48px;margin-top:9px;padding:11px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--bg2);color:var(--ink);font-size:16px}.login-card button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--accent),#5c8f2e);color:#0d0e12;font-weight:900;cursor:pointer}.login-card a{display:inline-flex;margin-top:16px;color:var(--sub);font-size:12px;text-decoration:none}.msg{min-height:20px;margin-top:9px;color:var(--danger);font-size:12px}.loading{min-height:100vh;display:grid;place-items:center;color:var(--sub);font-size:13px;letter-spacing:.08em}
@media(max-width:1024px){.wrap{padding:24px 20px 80px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.chip,.top a,.top button{min-height:44px}}
@media(max-width:640px){.wrap{padding:18px 14px 70px}.top{margin-bottom:30px}.top .studio{width:100%;margin-left:0}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:42px}.hero p{font-size:16px;line-height:1.6}.count{width:100%;height:auto;grid-template-columns:auto auto;justify-content:flex-start;gap:9px;padding:16px 18px;border-radius:16px}.count b{font-size:28px}.count span{margin:0}.grid{grid-template-columns:1fr}.card{min-height:238px;padding:19px}.card h2{font-size:24px}.card p{font-size:14px}.stats{gap:5px}.stat b{font-size:15px}.filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.chip{flex:0 0 auto;font-size:14px}}
</style>
</head>
<body>
<div class="loading" id="loading">RECAP LIBRARY LOADING…</div>
<section class="login hidden" id="login">
  <div class="login-card">
    <div class="kicker">PRESENCE · MANAGER ONLY</div>
    <h1>월별 팀 리캡</h1>
    <p>Presence 관리자 계정으로 로그인하면 저장된 월별 리캡을 발표 모드로 열 수 있습니다.</p>
    <input id="loginId" placeholder="Presence 아이디" autocomplete="username">
    <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="loginBtn">리캡 라이브러리 열기</button>
    <div class="msg" id="loginMsg"></div>
    <a href="index.html">← Presence Hub</a>
  </div>
</section>
<main class="wrap hidden" id="library">
  <nav class="top">
    <a href="index.html">← 허브</a>
    <a href="edu.html">에듀케이션</a>
    <a class="studio" href="recap-studio.html">＋ 월간 리캡 작성</a>
  </nav>
  <div class="kicker">PRESENCE RECAP LIBRARY</div>
  <section class="hero">
    <div><h1>Monthly Team <span>Recap.</span></h1><p>저장된 월별 리캡을 한 장씩 넘기는 발표 화면으로 확인하고, 같은 디자인의 PowerPoint 파일로 내려받을 수 있습니다.</p></div>
    <div class="count"><b id="recapCount">0</b><span>SAVED RECAPS</span></div>
  </section>
  <div class="filters" id="filters" aria-label="연도 필터"></div>
  <section class="grid" id="cards" aria-live="polite"></section>
</main>
<script type="module">
const CFG={apiKey:'AIzaSyCYKKnK8myrSM-eip9HEJxYRq_hzpfPUY0',authDomain:'presence-team.firebaseapp.com',databaseURL:'https://presence-team-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'presence-team',appId:'1:1056684483470:web:1f50113d410b53458d3adf'};
const [$app,$db,$auth]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js'),import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js')]);
const fbapp=$app.initializeApp(CFG,'recapArchive'),db=$db.getDatabase(fbapp),auth=$auth.getAuth(fbapp),PARAM=new URLSearchParams(location.search),LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname),FIXTURE=LOCAL&&PARAM.has('fixture');
const $=id=>document.getElementById(id),get=p=>$db.get($db.ref(db,p)).then(s=>s.val()),set=(p,v)=>$db.set($db.ref(db,p),v),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),hash=s=>{let h=5381;for(const c of(s||''))h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)},manager=u=>!!u&&(u.uid==='admin'||['TL','AOP','OP','OWNER'].includes(String(u.role||'').toUpperCase()));
let monthly={},activeYear='ALL';
async function ensureAnon(){if(auth.authStateReady)await auth.authStateReady();if(auth.currentUser)return auth.currentUser;return(await $auth.signInAnonymously(auth)).user}
function totals(d){const members=Array.isArray(d?.members)?d.members:[],sales=members.reduce((s,m)=>s+(m.scores||[]).reduce((a,b)=>a+(+b||0),0),0),days=members.reduce((s,m)=>s+(+m.days||0),0),income=members.reduce((s,m)=>s+(m.incomeWeeks||[]).reduce((a,b)=>a+(+b||0),0),0);return{people:members.length,sales,income,avg:days?sales/days:0}}
function money(n){const v=Math.round(+n||0);return v>=1000000?'₩'+(v/1000000).toFixed(v>=10000000?1:2)+'M':'₩'+v.toLocaleString('ko-KR')}
function fixtureRecaps(){const member=(name,role,base)=>({name,role,days:18,scores:[base,base+2,base+1,base+3],incomeWeeks:[base*42000,base*39000,base*45000,base*41000]});return{'2026-08':{month:'2026-08',leader:'임재영 AOP',members:[member('임재영','AOP',9),member('고윤경','TL',8),member('손예진','LR',7)],updatedAt:Date.now()},'2026-07':{month:'2026-07',leader:'임재영 AOP',members:[member('임재영','AOP',8),member('고윤경','TL',7)],updatedAt:Date.now()-86400000*31}}}
function showLogin(msg=''){$('loading').classList.add('hidden');$('library').classList.add('hidden');$('login').classList.remove('hidden');$('loginMsg').textContent=msg}
function showLibrary(data){monthly=data||{};$('loading').classList.add('hidden');$('login').classList.add('hidden');$('library').classList.remove('hidden');render()}
async function restore(){if(FIXTURE){const role=String(PARAM.get('fixture')||'admin').toLowerCase();if(role==='member')return showLogin('리캡 라이브러리는 관리자 전용입니다.');return showLibrary(fixtureRecaps())}try{const au=await ensureAnon(),sess=await get('authSessions/'+au.uid);if(!sess?.userUid)return showLogin();const user=await get('users/'+sess.userUid);if(!user||user.status!=='active'||!manager({...user,uid:user.uid||sess.userUid}))return showLogin('관리자 권한이 필요합니다.');showLibrary(await get('recaps/published'))}catch(e){showLogin('리캡 목록을 불러오지 못했습니다. 다시 로그인해 주세요.')}}
async function login(){const id=$('loginId').value.trim(),pw=$('loginPw').value;if(!id||!pw)return $('loginMsg').textContent='아이디와 비밀번호를 입력해 주세요.';$('loginMsg').textContent='연결하는 중…';try{const au=await ensureAnon(),key=id.toLowerCase().replace(/[.#$\/\[\]]/g,'_'),uid=await get('loginIndex/'+key);if(!uid)throw 0;await set('authSessions/'+au.uid,{idKey:key,userUid:uid,proof:hash(pw),createdAt:Date.now()});const user=await get('users/'+uid);if(!user||user.status!=='active'||!manager({...user,uid:user.uid||uid}))throw 0;showLibrary(await get('recaps/published'))}catch(e){$('loginMsg').textContent='아이디, 비밀번호 또는 관리자 권한을 확인해 주세요.'}}
function render(){const keys=Object.keys(monthly||{}).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort().reverse(),years=[...new Set(keys.map(k=>k.slice(0,4)))];$('recapCount').textContent=keys.length;$('filters').innerHTML=`<button class="chip ${activeYear==='ALL'?'on':''}" data-year="ALL">전체 <small>${keys.length}</small></button>`+years.map(y=>`<button class="chip ${activeYear===y?'on':''}" data-year="${y}">${y} <small>${keys.filter(k=>k.startsWith(y)).length}</small></button>`).join('');const visible=keys.filter(k=>activeYear==='ALL'||k.startsWith(activeYear));$('cards').innerHTML=visible.map(k=>{const d=monthly[k]||{},t=totals(d),[y,m]=k.split('-'),updated=d.publishedAt?new Date(d.publishedAt).toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'추출 완료',fixture=FIXTURE?`&fixture=${encodeURIComponent(PARAM.get('fixture')||'admin')}`:'';return`<a class="card" href="recap-studio.html?mode=preview&present=1&published=1&month=${k}${fixture}"><div class="card-head"><span class="tag">RECAP</span><time>${esc(updated)}</time><span class="arrow">→</span></div><h2>${y}년 ${Number(m)}월 Team Recap</h2><p>${esc(d.leader||'Presence Team')} · 월간 성과와 팀 운영 리뷰</p><div class="stats"><div class="stat"><b>${t.sales}</b><span>SALES</span></div><div class="stat"><b>${t.avg.toFixed(2)}</b><span>AVG</span></div><div class="stat"><b>${money(t.income)}</b><span>REAL INCOME</span></div></div><div class="launch"><i></i>발표 슬라이드 열기</div></a>`}).join('')||'<div class="state"><b>사이트로 추출된 리캡이 없습니다.</b>완성 리캡 보기에서 ‘사이트 추출’을 누르면 이곳에 월별 발표 카드가 만들어집니다.<br><a href="recap-studio.html">월간 리캡 작성하기 →</a></div>'}
$('filters').onclick=e=>{const b=e.target.closest('[data-year]');if(!b)return;activeYear=b.dataset.year;render()};$('loginBtn').onclick=login;$('loginPw').onkeydown=e=>{if(e.key==='Enter')login()};restore();
</script>
</body>
</html>
