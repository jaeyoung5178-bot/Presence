  <script type="module">
    const app=document.querySelector('#app'),toastEl=document.querySelector('#toast');
    const cfg={apiKey:'AIzaSyCYKKnK8myrSM-eip9HEJxYRq_hzpfPUY0',authDomain:'presence-team.firebaseapp.com',databaseURL:'https://presence-team-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'presence-team',appId:'1:1056684483470:web:1f50113d410b53458d3adf'};
    const DEFAULT_ROSTER=['이예승','유영진','임재영','장재원','김한별','김주아','고윤경','박인선','유승민','윤채영','김종훈','손예진','이예지','권영웅','홍서현','민병준','황혜진','이수민','류호연','임원석','김나윤','박동하','박성은','이민섭','윤태현'];
    const SEED={'2026-10-26':['유영진','임재영','김주아','박인선','유승민','손예진','권영웅','류호연','박성은','윤태현'],'2026-10-27':['유영진','임재영','김주아','고윤경','박인선','유승민','윤채영','손예진','권영웅','민병준','황혜진','이수민','류호연','임원석','김나윤','박동하','박성은','이민섭','윤태현'],'2026-10-28':['유영진','임재영','고윤경','박인선','유승민','윤채영','손예진','권영웅','민병준','황혜진','이수민','류호연','임원석','김나윤','박동하','박성은','이민섭'],'2026-10-29':['유영진','임재영','김주아','고윤경','박인선','유승민','윤채영','손예진','권영웅','민병준','황혜진','이수민','류호연','임원석','김나윤','박동하','박성은','이민섭','윤태현'],'2026-10-30':['유영진','임재영','김주아','고윤경','박인선','유승민','윤채영','손예진','권영웅','민병준','황혜진','이수민','류호연','임원석','김나윤','박동하','이민섭','윤태현'],'2026-10-31':['고윤경','김나윤'],'2026-11-01':[]};
    const allowed=p=>p?.status==='active'&&(p.uid==='admin'||['TL','LR','AOP','OP','O','OWNER'].includes(String(p.role).toUpperCase()));
    const proof=password=>{let h=5381;for(const c of String(password))h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
    const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const cleanKey=x=>String(x).trim().toLowerCase().replace(/[.#$\/\[\]]/g,'_');
    const clone=x=>JSON.parse(JSON.stringify(x));
    const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const parseDate=s=>new Date(s+'T00:00:00');
    const monday=d=>{const x=new Date(d),day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));x.setHours(0,0,0,0);return x};
    const weekDates=d=>Array.from({length:7},(_,i)=>{const x=monday(d);x.setDate(x.getDate()+i);return iso(x)});
    const shortDate=s=>{const d=parseDate(s);return `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`};
    const weekdays=['일','월','화','수','목','금','토'];
    const given=n=>n.length>1?n.slice(1):n;
    const unique=a=>[...new Set(a.filter(Boolean))];
    let sdk,user=null,doc=null,tab='week',anchor=new Date(Date.now()+864e5),editing=false,release=null,remotePending=null,busy=false,seedAttempted=false;
    const seedDoc=()=>({version:1,roster:DEFAULT_ROSTER.slice(),schedule:clone(SEED),updatedAt:Date.now(),updatedBy:'Presence Setup',source:'hub'});
    function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),3200)}
    async function firebase(){if(!sdk)sdk=Promise.all(['app','database','auth'].map(s=>import(`https://www.gstatic.com/firebasejs/10.12.0/firebase-${s}.js`))).then(([a,d,h])=>{const instance=a.getApps().find(x=>x.name==='setupManager')||a.initializeApp(cfg,'setupManager');return{d,h,db:d.getDatabase(instance),auth:h.getAuth(instance)}});return sdk}
    async function read(path){const f=await firebase(),snap=await f.d.get(f.d.ref(f.db,path));return snap.val()}
    const auth={async session(){const f=await firebase();await f.auth.authStateReady();return f.auth.currentUser||(await f.h.signInAnonymously(f.auth)).user},async restore(){const s=await this.session(),v=await read(`authSessions/${s.uid}`);if(!v?.userUid)return null;const p=await read(`users/${v.userUid}`),u=p?{...p,uid:v.userUid}:null;return allowed(u)?u:null},async login(id,password){const s=await this.session(),idKey=cleanKey(id),uid=await read(`loginIndex/${idKey}`);if(typeof uid!=='string')throw Error('아이디 또는 비밀번호를 확인해 주세요.');const f=await firebase();await f.d.set(f.d.ref(f.db,`authSessions/${s.uid}`),{idKey,userUid:uid,proof:proof(password),createdAt:Date.now()});const u=await this.restore();if(!u)throw Error('활성 TL 이상 계정만 사용할 수 있습니다.');return u},async logout(){const f=await firebase();if(f.auth.currentUser)await f.d.set(f.d.ref(f.db,`authSessions/${f.auth.currentUser.uid}`),null);await f.h.signOut(f.auth)}};
    async function authorize(){const f=await firebase(),current=f.auth.currentUser;if(!current)throw Error('다시 로그인해 주세요.');const [session,profile]=await Promise.all([read(`authSessions/${current.uid}`),read(`users/${user.uid}`)]);if(session?.userUid!==user.uid||!allowed({...profile,uid:user.uid}))throw Error('접근 권한이 변경되었습니다. 다시 로그인해 주세요.');return f}
    function normalize(raw){const roster=unique((Array.isArray(raw?.roster)?raw.roster:DEFAULT_ROSTER).map(x=>String(x).trim()));const schedule={};for(const [date,names] of Object.entries(raw?.schedule||SEED))schedule[date]=roster.filter(name=>new Set(Array.isArray(names)?names:[]).has(name));return{version:1,roster,schedule,updatedAt:Number(raw?.updatedAt||0),updatedBy:raw?.updatedBy||'',source:raw?.source||''}}
    async function save(next,message='저장했어요 ✓'){if(busy)return;busy=true;syncState('실시간 저장 중…','busy');try{const f=await authorize(),payload={...normalize(next),version:2,rosterVersion:'2026-10-26.weekly-current-v5',updatedAt:Date.now(),updatedBy:user.name||user.uid,source:'hub'},record={date:'2000-01-01',title:'Presence Setup Manager Sync',time:'',type:'business',teamKey:'presence',teamName:'Presence',kind:'setupManager',createdBy:user.uid,leaderName:user.name||'',createdAt:payload.updatedAt,updatedAt:payload.updatedAt,setupManager:payload};await f.d.set(f.d.ref(f.db,`teamCalendarEvents/${user.uid}_setup_manager`),record);doc=payload;toast(message)}catch(e){toast(e.message);syncState('연결 확인 필요','error')}finally{busy=false}}
    function latestSetup(records){return Object.values(records||{}).filter(r=>r?.kind==='setupManager'&&r.setupManager).sort((a,b)=>Number(b.setupManager.updatedAt||b.updatedAt||0)-Number(a.setupManager.updatedAt||a.updatedAt||0))[0]?.setupManager||null}
    function subscribe(){release?.();firebase().then(f=>{release=f.d.onValue(f.d.ref(f.db,'teamCalendarEvents'),snap=>{const raw=latestSetup(snap.val());if(!raw){if(!seedAttempted){seedAttempted=true;save(seedDoc(),'현재 명단으로 셋업 매니저를 시작했어요')}return}const incoming=normalize(raw);if(editing){remotePending=incoming;syncState('다른 화면 변경 대기','busy');return}doc=incoming;renderBody();syncState('실시간 연결됨','ok')},e=>{console.error(e);syncState('연결 확인 필요','error')})})}
    function syncState(label,tone=''){const el=document.querySelector('#sync');if(!el)return;el.className='status '+tone;el.innerHTML=`<i></i><span>${esc(label)}</span>`}
    function authView(message=''){app.innerHTML=`<div class="auth-wrap"><form class="auth-card" id="login"><p class="eyebrow">PRESENCE / OPERATIONS</p><h1>셋업 매니저</h1><p>워크북과 같은 실시간 명단을 사용하는 TL 이상 전용 페이지입니다.</p>${message?`<p class="error-note" role="alert">${esc(message)}</p>`:''}<label for="id">워크북 아이디</label><input id="id" name="id" autocomplete="username" required><label for="pw">비밀번호</label><input id="pw" name="password" type="password" autocomplete="current-password" required><button class="primary">로그인</button><a class="ghost" style="display:grid;place-items:center;margin-top:10px;color:inherit;text-decoration:none" href="../index.html">Presence Hub로 돌아가기</a></form></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{user=await auth.login(e.currentTarget.elements.id.value,e.currentTarget.elements.password.value);renderShell();subscribe()}catch(err){authView(err.message)}}}
    function renderShell(){app.innerHTML=`<div class="shell"><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">📋</span><span>Presence Setup<small>REALTIME OPERATIONS</small></span></a><div class="top-actions"><div id="sync" class="status busy"><i></i><span>실시간 연결 중…</span></div><button id="logout" class="ghost hide-mobile">로그아웃</button></div></header><section class="hero"><p class="eyebrow">SETUP MANAGER · LIVE</p><h1>${esc(user.name)}님,<br>이번 주 셋업을 준비해요.</h1><p>워크북 셋업비서와 같은 명단을 사용합니다. 어느 쪽에서 수정해도 다른 화면에 바로 반영됩니다.</p></section><nav class="toolbar"><div class="tabs"><button data-tab="week">요일별 셋업</button><button data-tab="daily">데일리 공지</button><button data-tab="roster">명단 관리</button></div><div class="toolbar-actions"><button id="copy-week" class="ghost">주간 전체 복사</button><button id="edit-week" class="primary">이번 주 수정</button></div></nav><main id="content"></main></div>`;document.querySelector('#logout').onclick=async()=>{await auth.logout();user=null;release?.();authView()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editing=false;remotePending=null;renderBody()});document.querySelector('#copy-week').onclick=()=>copyText(weekDates(anchor).map(setupText).join('\n\n'));document.querySelector('#edit-week').onclick=()=>{tab='week';editing=true;renderBody()};renderBody()}
    function setupNames(date){const selected=new Set(doc?.schedule?.[date]||[]);return(doc?.roster||[]).filter(n=>selected.has(n))}
    function setupText(date){const names=setupNames(date),d=parseDate(date),lines=[];for(let i=0;i<names.length;i+=5)lines.push(names.slice(i,i+5).map(given).join(' '));return`${d.getMonth()+1}/${d.getDate()} 필드인원\n\n${lines.join('\n')||'필드 인원 없음'}\n\n(${names.length}명)`}
    function rangeLabel(){const dates=weekDates(anchor);return`${shortDate(dates[0])} — ${shortDate(dates[6])}`}
    function navHtml(){return`<div class="week-nav"><button class="icon-btn" data-week="-1" aria-label="이전 주">‹</button><div class="week-range">${rangeLabel()}</div><button class="icon-btn" data-week="1" aria-label="다음 주">›</button></div>`}
    function weekView(){const dates=weekDates(anchor),today=iso(new Date());if(editing)return`<section class="panel"><div class="section-head"><div><p class="eyebrow">WEEKLY SETUP · EDIT</p><h2>요일별 인원 수정</h2></div>${navHtml()}</div><div class="edit-grid">${dates.map(date=>`<div class="edit-card"><label for="edit-${date}">${shortDate(date)} (${weekdays[parseDate(date).getDay()]})<span>${setupNames(date).length}명</span></label><textarea id="edit-${date}" data-date="${date}" spellcheck="false">${esc(setupNames(date).join(' '))}</textarea></div>`).join('')}</div><div class="edit-actions"><button id="cancel-edit" class="ghost">취소</button><button id="save-week" class="primary">변경 내용 저장</button></div></section>`;return`<section class="panel"><div class="section-head"><div><p class="eyebrow">WEEKLY SETUP</p><h2>요일별 필드 인원</h2><p>카카오톡 공지 형식으로 바로 복사할 수 있어요.</p></div>${navHtml()}</div><div class="week-grid">${dates.map(date=>{const names=setupNames(date),d=parseDate(date);return`<article class="day-card ${date===today?'today':''} ${names.length?'':'empty'}"><div class="day-head"><strong>${shortDate(date)} (${weekdays[d.getDay()]})</strong><span class="count">${names.length}명</span></div><div class="names">${esc(names.map(given).join(' · ')||'필드 인원 없음')}</div><button class="card-copy" data-copy-date="${date}">카카오톡용 복사</button></article>`}).join('')}</div></section>`}
    function dailyView(){const selected=weekDates(anchor)[0],names=setupNames(selected);return`<section class="panel"><div class="section-head"><div><p class="eyebrow">DAILY NOTICE</p><h2>하루 셋업과 공지</h2><p>체크한 명단은 워크북 데일리 셋업에도 반영됩니다.</p></div><input id="daily-date" class="field date-field" type="date" value="${selected}" style="max-width:190px;min-height:50px"></div><div class="daily-layout"><div class="subpanel"><h3>필드 인원 선택</h3><p><b id="daily-count">${names.length}</b>명 선택됨</p><div class="person-list">${doc.roster.map(name=>`<label class="person"><input type="checkbox" value="${esc(name)}" ${names.includes(name)?'checked':''}><span>${esc(name)}</span></label>`).join('')}</div><div class="edit-actions"><button id="save-daily" class="primary">선택 인원 저장</button></div></div><div class="subpanel"><h3>공지 미리보기</h3><p>저장 후 복사하면 최신 명단이 사용됩니다.</p><div class="notice-card"><textarea id="daily-notice" readonly>${esc(setupText(selected))}</textarea><div class="notice-actions"><button id="copy-daily" class="primary">공지 복사</button></div></div></div></div></section>`}
    function rosterView(){return`<section class="panel"><div class="section-head"><div><p class="eyebrow">MASTER ROSTER</p><h2>위클리 명단 관리</h2><p>한 줄에 한 명씩, 위에서 아래 순서가 위클리 순서입니다.</p></div></div><div class="roster-layout"><textarea id="roster" class="field roster-text" spellcheck="false">${esc(doc.roster.join('\n'))}</textarea><aside class="roster-help"><strong>${doc.roster.length}명</strong><p>현재 사진 기준 명단입니다. 퇴사자를 삭제하거나 신입을 추가하면 워크북 위클리에도 똑같이 반영됩니다.</p><button id="save-roster" class="primary" style="width:100%">명단 저장</button></aside></div></section>`}
    function renderBody(){if(!doc)return;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));document.querySelector('#edit-week').classList.toggle('hidden',tab!=='week');document.querySelector('#copy-week').classList.toggle('hidden',tab!=='week');document.querySelector('#content').innerHTML=tab==='daily'?dailyView():tab==='roster'?rosterView():weekView();bindBody()}
    function resolveNames(text){const tokens=String(text).split(/[\s,\/·]+/).filter(Boolean),roster=doc.roster,out=[],bad=[];for(const token of tokens){const found=roster.find(n=>n===token)||roster.find(n=>given(n)===token)||roster.find(n=>n.endsWith(token));if(found&&!out.includes(found))out.push(found);else if(!found)bad.push(token)}return{out,bad}}
    function bindBody(){document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{anchor.setDate(anchor.getDate()+Number(b.dataset.week)*7);renderBody()});document.querySelectorAll('[data-copy-date]').forEach(b=>b.onclick=()=>copyText(setupText(b.dataset.copyDate)));if(editing){document.querySelector('#cancel-edit').onclick=()=>{editing=false;if(remotePending){doc=remotePending;remotePending=null}renderBody()};document.querySelector('#save-week').onclick=async()=>{const next=clone(doc),bad=[];document.querySelectorAll('[data-date]').forEach(t=>{const parsed=resolveNames(t.value);next.schedule[t.dataset.date]=parsed.out;bad.push(...parsed.bad)});if(bad.length){toast(`명단에 없는 이름: ${bad.slice(0,4).join(', ')}`);return}editing=false;remotePending=null;await save(next,'요일별 셋업 명단을 저장했어요 ✓')};return}if(tab==='daily'){const date=document.querySelector('#daily-date'),refresh=()=>{const names=setupNames(date.value);document.querySelectorAll('.person input').forEach(c=>c.checked=names.includes(c.value));document.querySelector('#daily-count').textContent=names.length;document.querySelector('#daily-notice').value=setupText(date.value)};date.onchange=()=>{anchor=parseDate(date.value);refresh()};document.querySelectorAll('.person input').forEach(c=>c.onchange=()=>document.querySelector('#daily-count').textContent=document.querySelectorAll('.person input:checked').length);document.querySelector('#save-daily').onclick=async()=>{const next=clone(doc),chosen=[...document.querySelectorAll('.person input:checked')].map(c=>c.value);next.schedule[date.value]=next.roster.filter(n=>chosen.includes(n));await save(next,'데일리 셋업을 저장했어요 ✓');document.querySelector('#daily-notice').value=(()=>{const old=doc;doc=next;const text=setupText(date.value);doc=old;return text})()};document.querySelector('#copy-daily').onclick=()=>copyText(document.querySelector('#daily-notice').value)}if(tab==='roster')document.querySelector('#save-roster').onclick=async()=>{const roster=unique(document.querySelector('#roster').value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean));if(!roster.length){toast('명단을 한 명 이상 입력해 주세요.');return}const next=clone(doc);next.roster=roster;for(const date of Object.keys(next.schedule))next.schedule[date]=roster.filter(n=>next.schedule[date].includes(n));await save(next,'위클리 명단을 저장했어요 ✓')}}
    async function copyText(text){try{await navigator.clipboard.writeText(text);toast('카카오톡용 문구를 복사했어요 ✓')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast('복사했어요 ✓')}}
    if(location.hostname==='127.0.0.1'&&new URLSearchParams(location.search).has('preview')){user={uid:'preview',name:'임재영',role:'AOP',status:'active'};doc=seedDoc();renderShell();syncState('미리보기 연결','ok')}else try{user=await auth.restore();if(user){doc=seedDoc();renderShell();subscribe()}else authView()}catch(e){authView(e.message)}
  </script>
</body>
</html>
