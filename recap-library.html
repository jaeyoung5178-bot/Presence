<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>저장된 리캡 열람 · Presence</title>
<link rel="icon" href="icon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#0d0e12;--bg2:#14161c;--card:#1a1d25;--card2:#20242e;--ink:#f3efe6;--sub:#a7a294;--line:#2c313c;--line2:#3a4150;--accent:#8fd14f;--gold:#e8c877;--blue:#5d8cff;--danger:#e06a6a}
*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:radial-gradient(1100px 620px at 50% -10%,#1c202a 0%,var(--bg) 62%);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}.hidden{display:none!important}button,input{font:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:28px 24px 90px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}.top a,.top button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub);font-size:13px;font-weight:750;text-decoration:none;cursor:pointer}.top a:hover,.top button:hover{border-color:var(--line2);color:var(--ink)}.top .studio{margin-left:auto;border-color:rgba(143,209,79,.45);color:var(--accent)}
.kicker{color:var(--gold);font-size:12px;font-weight:850;letter-spacing:.26em}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin:10px 0 28px}.hero h1{margin:0;font-size:clamp(34px,5vw,64px);letter-spacing:-.06em;line-height:1}.hero h1 span{color:var(--accent)}.hero p{max-width:590px;margin:13px 0 0;color:var(--sub);font-size:15px;line-height:1.65}.count{flex:0 0 auto;display:grid;place-items:center;width:112px;height:112px;border:1px solid var(--line2);border-radius:28px;background:linear-gradient(145deg,#20242e,#15171d);box-shadow:0 18px 42px rgba(0,0,0,.26)}.count b{font-size:38px;color:var(--accent);line-height:1}.count span{margin-top:-18px;color:var(--sub);font-size:11px;font-weight:750;letter-spacing:.12em}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{min-height:44px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub);font-size:14px;font-weight:750;cursor:pointer}.chip:hover{border-color:var(--line2);color:var(--ink)}.chip.on{border-color:transparent;background:linear-gradient(135deg,var(--accent),#5c8f2e);color:#0d0e12}.chip small{margin-left:5px;opacity:.68}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{position:relative;display:flex;min-height:334px;flex-direction:column;padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--card),#171920);color:var(--ink);text-decoration:none;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#465064;background:linear-gradient(145deg,var(--card2),#191c24);box-shadow:0 20px 48px rgba(0,0,0,.28)}.card-head{display:flex;align-items:center;gap:8px}.tag{display:inline-flex;padding:5px 9px;border:1px solid var(--line2);border-radius:7px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.14em}.card time{color:var(--sub);font-size:12px}.arrow{margin-left:auto;color:var(--sub);font-size:20px;transition:.2s}.card:hover .arrow{color:var(--accent);transform:translateX(3px)}.cover{position:relative;width:100%;aspect-ratio:16/9;margin:16px 0 15px;border:1px solid var(--line);border-radius:13px;background:#f7f8fb center/cover no-repeat;overflow:hidden}.cover:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}.card h2{margin:0 0 7px;font-size:26px;letter-spacing:-.045em}.card p{margin:0;color:var(--sub);font-size:14px;line-height:1.55}.card-foot{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:15px}.card-foot b{color:#fff;font-size:14px}.card-foot span{color:var(--sub);font-size:12px}.launch{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--gold);font-size:12px;font-weight:800}.launch i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(143,209,79,.55)}.card.empty{cursor:default;border-style:dashed;background:rgba(26,29,37,.52)}.card.empty:hover{transform:none;border-color:var(--line);box-shadow:none}.card.empty .tag{color:var(--sub)}.card.empty .cover{display:grid;place-items:center;border-style:dashed;background:rgba(13,14,18,.32);color:#777f8f;font-size:14px;font-weight:800;letter-spacing:.08em}.card.empty h2,.card.empty p{color:#777f8f}
.state{grid-column:1/-1;padding:54px 24px;border:1px dashed var(--line2);border-radius:18px;color:var(--sub);text-align:center;line-height:1.75}.state b{display:block;margin-bottom:7px;color:var(--ink);font-size:18px}.state a{color:var(--accent)}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);padding:28px;border:1px solid var(--line2);border-radius:24px;background:var(--card);box-shadow:0 22px 70px rgba(0,0,0,.45)}.login-card .kicker{font-size:10px}.login-card h1{margin:10px 0 6px;font-size:30px;letter-spacing:-.04em}.login-card p{margin:0 0 14px;color:var(--sub);font-size:13px;line-height:1.65}.login-card input{width:100%;min-height:48px;margin-top:9px;padding:11px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--bg2);color:var(--ink);font-size:16px}.login-card button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--accent),#5c8f2e);color:#0d0e12;font-weight:900;cursor:pointer}.login-card a{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;color:var(--sub);font-size:12px;text-decoration:none}.msg{min-height:20px;margin-top:9px;color:var(--danger);font-size:12px}.loading{min-height:100vh;display:grid;place-items:center;color:var(--sub);font-size:13px;letter-spacing:.08em}
@media(max-width:1024px){.wrap{padding:24px 20px 80px}.card,.chip,.top a,.top button{min-height:44px}}
@media(max-width:640px){.wrap{padding:18px 14px 70px}.top{margin-bottom:30px}.top .studio{width:100%;margin-left:0}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:42px}.hero p{font-size:16px;line-height:1.6}.count{width:100%;height:auto;grid-template-columns:auto auto;justify-content:flex-start;gap:9px;padding:16px 18px;border-radius:16px}.count b{font-size:28px}.count span{margin:0}.grid{grid-template-columns:1fr}.card{min-height:310px;padding:16px}.card h2{font-size:24px}.card p{font-size:14px}.filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.chip{flex:0 0 auto;font-size:14px}.card-foot{align-items:flex-start;flex-wrap:wrap}.launch{width:100%;margin-left:0}}
button:focus-visible,a:focus-visible{outline:3px solid #a8c7ff;outline-offset:4px}.state button{min-height:44px;margin-top:12px;padding:10px 16px;border-radius:10px;border:1px solid #526786;background:#233452;color:#edf4ff;font:inherit;cursor:pointer}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading">RECAP LIBRARY LOADING…</div>
<section class="login hidden" id="login">
  <div class="login-card">
    <div class="kicker">PRESENCE · MANAGER ONLY</div>
    <h1>저장된 리캡 열람</h1>
    <p>Presence 관리자 계정으로 로그인하면 저장된 월별 리캡과 지난 자료를 열람할 수 있습니다.</p>
    <input id="loginId" placeholder="Presence 아이디" autocomplete="username">
    <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="loginBtn">리캡 라이브러리 열기</button>
    <div class="msg" id="loginMsg"></div>
    <a href="index.html">← Presence Hub</a>
  </div>
</section>
<main class="wrap hidden" id="library">
  <nav class="top">
    <a href="index.html">← 허브</a>
    <a href="recaps.html">리캡 입구</a>
    <a class="studio" href="recap-keynote.html">＋ 작성 및 저장</a>
  </nav>
  <div class="kicker">PRESENCE RECAP LIBRARY</div>
  <section class="hero">
    <div><h1>Monthly Team <span>Recap.</span></h1><p>저장된 리캡을 월별로 열람합니다. 기존 발표본과 PowerPoint 자료도 함께 확인할 수 있습니다.</p></div>
    <div class="count"><b id="recapCount">0</b><span>SAVED RECAPS</span></div>
  </section>
  <div class="filters" id="filters" aria-label="연도 필터"></div>
  <section class="grid" id="cards" aria-live="polite"></section>
</main>
<script type="module">
import {gateway} from './assets/recap-keynote/cloud.js?v=20261009-tree-5';
const api=gateway(),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FILE_RECAPS={'2026-07':{slides:15,cover:'리캡/2026-07/slides/slide-1.png'},'2026-05':{slides:18,cover:'리캡/2026-05/slides/slide-1.png'},'2026-04':{slides:15,cover:'리캡/2026-04/slides/slide-1.png'}};
let saved={},published={},activeYear='ALL',warnings=[];
function showLogin(msg=''){$('loading').classList.add('hidden');$('library').classList.add('hidden');$('login').classList.remove('hidden');$('loginMsg').textContent=msg;}
function card(k,d,kind){const [y,m]=k.split('-'),isSaved=kind==='saved',snap=d.keynote||d,members=Array.isArray(snap.members)?snap.members:[],sales=members.reduce((a,m)=>a+(m.scores||[]).reduce((a,v)=>a+(Number(v)||0),0),0),days=members.reduce((a,m)=>a+(Number(m.days)||0),0),url=isSaved?'recap-view.html?month='+k:(d.keynote?'recap-view.html?published=1&month='+k:'recap-studio.html?mode=preview&present=1&published=1&month='+k);return '<a class="card" href="'+url+'"><div class="card-head"><span class="tag">'+(isSaved?'SAVED RECAP':'PUBLISHED RECAP')+'</span><time>'+esc(d.updatedAt?new Date(d.updatedAt).toLocaleDateString('ko-KR'):'')+'</time><span class="arrow">→</span></div><div class="cover" style="display:grid;place-items:center;background:linear-gradient(135deg,#23365d,#192536);color:#b5ceff;font-size:38px;font-weight:700">'+y+'.'+m+'</div><h2>'+y+'년 '+Number(m)+'월 Team Recap</h2><p>'+esc(snap.teamName||snap.leader||'Presence Team')+' · '+(isSaved?'저장된 월별 리캡':'게시된 발표본')+'</p><div class="card-foot"><b>'+sales+' SALES</b><span>AVG '+(days?sales/days:0).toFixed(2)+'</span><span class="launch"><i></i>열람하기</span></div></a>';}
function render(){const entries=[];for(const k of Object.keys(saved).filter(k=>/^\d{4}-(0[1-9]|1[0-2])$/.test(k)))entries.push({k,html:card(k,saved[k],'saved')});for(const k of Object.keys(published).filter(k=>/^\d{4}-(0[1-9]|1[0-2])$/.test(k)))entries.push({k,html:card(k,published[k],'published')});for(const [k,f] of Object.entries(FILE_RECAPS)){const [y,m]=k.split('-');entries.push({k,html:'<a class="card" href="recap-viewer.html?month='+k+'"><div class="card-head"><span class="tag">PPT RECAP</span><time>'+y+'.'+m+'</time><span class="arrow">→</span></div><div class="cover" style="background-image:url(\''+f.cover+'\')"></div><h2>'+y+'년 '+Number(m)+'월 Team Recap</h2><p>Presence 월간 운영 리캡 · PowerPoint 원본</p><div class="card-foot"><b>'+f.slides+' SLIDES</b><span>PPTX</span><span class="launch"><i></i>열람하기</span></div></a>'});}entries.sort((a,b)=>b.k.localeCompare(a.k));const years=[...new Set(entries.map(x=>x.k.slice(0,4)))];$('recapCount').textContent=entries.length;$('filters').innerHTML='<button class="chip '+(activeYear==='ALL'?'on':'')+'" data-year="ALL">전체</button>'+years.map(y=>'<button class="chip '+(activeYear===y?'on':'')+'" data-year="'+y+'">'+y+'</button>').join('');$('cards').innerHTML=(warnings.length?'<div class="state">'+warnings.map(esc).join('<br>')+'<br><button id="retry">다시 불러오기</button></div>':'')+entries.filter(x=>activeYear==='ALL'||x.k.startsWith(activeYear)).map(x=>x.html).join('');$('retry')?.addEventListener('click',load);}
async function load(){try{const data=await api.list();saved=data.saved||{};published=data.published||{};warnings=data.warnings||[];$('loading').classList.add('hidden');$('login').classList.add('hidden');$('library').classList.remove('hidden');render();}catch(e){showLogin(e.message||'저장된 리캡 목록을 불러오지 못했습니다.');}}
async function login(){const btn=$('loginBtn');btn.disabled=true;$('loginMsg').textContent='로그인 확인 중…';try{await api.login($('loginId').value.trim(),$('loginPw').value);$('loginPw').value='';await load();}catch(e){$('loginMsg').textContent=e.message||'로그인을 확인해 주세요.';}finally{btn.disabled=false;}}
$('filters').onclick=e=>{const b=e.target.closest('[data-year]');if(b){activeYear=b.dataset.year;render();}};$('loginBtn').onclick=login;$('loginPw').onkeydown=e=>{if(e.key==='Enter')login();};
try{if(await api.restore())await load();else showLogin();}catch(e){showLogin(e.message||'로그인이 필요합니다.');}
</script>
</body>
</html>
