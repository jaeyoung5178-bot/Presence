"n": 10}, {"source": 10, "title": "1942년, 옥스퍼드에서", "section": "옥스팜 이해", "bg": "#F6F5F0", "items": [{"kind": "text", "text": "옥스팜 이해", "x": 54, "y": 36, "w": 900, "h": 30, "size": 18, "color": "#087342", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "1942년, 옥스퍼드에서", "x": 52, "y": 89, "w": 1176, "h": 90, "size": 56, "color": "#152019", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "text", "text": "OXFAM", "x": 49, "y": 205, "w": 1100, "h": 176, "size": 140, "color": "#087342", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "text", "text": "Oxford Committee for Famine Relief", "x": 56, "y": 396, "w": 1170, "h": 56, "size": 32, "color": "#152019", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "영국 옥스퍼드에서 시작된 국제구호 개발기구", "x": 56, "y": 491, "w": 1170, "h": 50, "size": 32, "color": "#647168", "weight": 400, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "전 세계 90개국 이상에서 활동", "x": 56, "y": 568, "w": 1170, "h": 50, "size": 32, "color": "#087342", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "PEACEMAKER", "x": 54, "y": 675, "w": 400, "h": 20, "size": 12, "color": "#647168", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "11", "x": 1177, "y": 674, "w": 49, "h": 23, "size": 14, "color": "#647168", "weight": 700, "font": "Pretendard", "align": "right", "lineSpacing": 1.24}], "notes": "원본 10페이지\n10\nOXFAM\n(OXFAM : Oxford Committee for Famine Relief)\n1942년 영국 옥스퍼드에서 시작된 옥스팜은 전 세계 90개국 이상에서 가난의 불공정을\n이겨내고 인간의 기본 권리가 보장되는 세상을 만들기 위해 노력해 온 국제구호 개발기구입니다.\n비전\n미션\n가난이 없는 공정한 세상\n옥스팜은 불평등하며 불공정한 가난을 끝내고 정의로운 세상을 만들기 위한 국제적, 사회적인\n무브언트(변화들 위한 움직임 및 활동)에 전 세계 모든 사람들과 교류하고, 변화시키며, 함께\n협력합니다.\n옥스팜이 일하는 방식\n사회적 변화 촉구\n옥스팜은 사회 운동에서 정부 정책에 이르기까지 가난의\n근본적 원인에 맞서 행동할 것입니다. 옥스맘은 빈곤을\n초래하는 부당함에 목소리를 높일 때, 변화를 이끌어낼 수\n있다는 것을 꾸준히 경험해 왔습니다.\n연대와 협력\n현지 파트너십: 옥스팜은 변화를 일으키는 전 세계 지역사회 기관들과 파트너십을 맺고 이를\n통해 효율적으로 일합니다.\n글로벌 네트워크: 옥스팜은 지원, 의사 결정권을 빈곤국까지 적극적으로 확대해 전 세계 개인 및\n조직과 함께 일하고 있습니다.", "n": 11}, {"source": 10, "title": "가난의 불공정을 이겨내는 일", "section": "옥스팜 이해", "bg": "#101A15", "items": [{"kind": "text", "text": "MISSION", "x": 55, "y": 52, "w": 900, "h": 35, "size": 20, "color": "#D9F279", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "인간의 기본 권리가\n보장되는 세상", "x": 50, "y": 169, "w": 1150, "h": 247, "size": 79, "color": "#FFFFFF", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "text", "text": "불평등하고 불공정한 가난을 끝내고 정의로운 세상을 만들기 위해\n국제적·사회적 움직임에 전 세계 사람들과 교류하고 함께 협력합니다.", "x": 55, "y": 496, "w": 1110, "h": 130, "size": 29, "color": "#D1DBD5", "weight": 400, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "PEACEMAKER", "x": 54, "y": 675, "w": 400, "h": 20, "size": 12, "color": "#A8B6AC", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "12", "x": 1177, "y": 674, "w": 49, "h": 23, "size": 14, "color": "#A6B3AA", "weight": 700, "font": "Pretendard", "align": "right", "lineSpacing": 1.24}], "notes": "원본 10페이지\n10\nOXFAM\n(OXFAM : Oxford Committee for Famine Relief)\n1942년 영국 옥스퍼드에서 시작된 옥스팜은 전 세계 90개국 이상에서 가난의 불공정을\n이겨내고 인간의 기본 권리가 보장되는 세상을 만들기 위해 노력해 온 국제구호 개발기구입니다.\n비전\n미션\n가난이 없는 공정한 세상\n옥스팜은 불평등하며 불공정한 가난을 끝내고 정의로운 세상을 만들기 위한 국제적, 사회적인\n무브언트(변화들 위한 움직임 및 활동)에 전 세계 모든 사람들과 교류하고, 변화시키며, 함께\n협력합니다.\n옥스팜이 일하는 방식\n사회적 변화 촉구\n옥스팜은 사회 운동에서 정부 정책에 이르기까지 가난의\n근본적 원인에 맞서 행동할 것입니다. 옥스맘은 빈곤을\n초래하는 부당함에 목소리를 높일 때, 변화를 이끌어낼 수\n있다는 것을 꾸준히 경험해 왔습니다.\n연대와 협력\n현지 파트너십: 옥스팜은 변화를 일으키는 전 세계 지역사회 기관들과 파트너십을 맺고 이를\n통해 효율적으로 일합니다.\n글로벌 네트워크: 옥스팜은 지원, 의사 결정권을 빈곤국까지 적극적으로 확대해 전 세계 개인 및\n조직과 함께 일하고 있습니다.", "n": 12}, {"source": 10, "title": "변화를 만드는 두 가지 방식", "section":  "color": "#647168", "weight": 700, "font": "Pretendard", "align": "right", "lineSpacing": 1.24}], "notes": "원본 52페이지\n\n활동사진 CPS\n제일 좋았던 50km 피니쉬 라인\n01\n02\n계측담당(배번호 스캐닝)음원하기, 서비스 안내하기\n힘든 길 걸어오신 참가자에게\n어떤 팀이 어느 구간을 통과중인지\n힘찬 응원으로 맞이하고\n확인하기 위해 팀원이 함께 모이면\n식음료, 마사지, 셔틀버스등\n스캐너로 계측하여 기록을 남긴다.\n필요한 서비스를 안내한다.\n03\n함께 사진찍기\n이 순간이 영원히 기억되길!\n함께 고난을 돌파하는 순간인\n만큼 사진은 필수\n04\nDNF(중도포기자)관리\n중도포기자를 기록 및 관리하여\n실제 트레일워커 진행중인\n인원은 몇명인지 파악함으로\n일정이 잘 진행되도록 돕는다.", "n": 62}, {"source": 52, "title": "CP5에서 함께한 일", "section": "트레일워커", "bg": "#F6F5F0", "items": [{"kind": "text", "text": "트레일워커", "x": 54, "y": 36, "w": 900, "h": 30, "size": 18, "color": "#087342", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "CP5에서 함께한 일", "x": 52, "y": 89, "w": 1176, "h": 90, "size": 56, "color": "#152019", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "image", "src": "assets/image762.png", "x": 54, "y": 199, "w": 575, "h": 290, "fit": "contain"}, {"kind": "text", "text": "함께 사진 찍기", "x": 54, "y": 521, "w": 575, "h": 52, "size": 34, "color": "#087342", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "text", "text": "고난을 돌파하는 순간이 오래 기억되도록 사진을 남깁니다.", "x": 54, "y": 590, "w": 565, "h": 73, "size": 23, "color": "#152019", "weight": 400, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "image", "src": "assets/image763.png", "x": 650, "y": 199, "w": 575, "h": 290, "fit": "contain"}, {"kind": "text", "text": "DNF 관리", "x": 650, "y": 521, "w": 575, "h": 52, "size": 34, "color": "#087342", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "text", "text": "중도포기자를 기록·관리하여 진행 중인 인원을 파악합니다.", "x": 650, "y": 590, "w": 565, "h": 73, "size": 23, "color": "#152019", "weight": 400, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "PEACEMAKER", "x": 54, "y": 675, "w": 400, "h": 2 드 스캔하면\n등록된 링크를 통해\n구호물품의 쓰임과\n간단한 퀴즈를 통해\n선착순 상품이 \n증정되는 이벤트\n기막힌 \n구호물품 등장 타이밍\n(경사가 ..)\n스마트폰으로\nQR 코드 스캔하면\n등록된 링크를 통해\n구호물품의 쓰임과\n간단한 퀴즈를 통해\n선착순 상품이\n증정되는 이벤트\n기막힌\n구호물품 등장\n타이밍\n(경사가 .•)\n은 복스방위의 보물찾기 이벤!\n카레 QR코드를 찍어보세요\nLIFECAVCD\nG0RETEX", "n": 75}, {"source": 65, "title": "숨은 옥스팜워크 보물 찾기", "section": "옥스팜 워크", "bg": "#F6F5F0", "items": [{"kind": "text", "text": "옥스팜 워크", "x": 54, "y": 36, "w": 900, "h": 30, "size": 18, "color": "#087342", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "숨은 옥스팜워크 보물 찾기", "x": 52, "y": 89, "w": 1176, "h": 90, "size": 56, "color": "#152019", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "image", "src": "assets/image845.png", "x": 75, "y": 194, "w": 329, "h": 454, "fit": "contain"}, {"kind": "image", "src": "assets/image846.png", "x": 482, "y": 194, "w": 329, "h": 454, "fit": "contain"}, {"kind": "image", "src": "assets/image847.png", "x": 889, "y": 194, "w": 329, "h": 454, "fit": "contain"}, {"kind": "text", "text": "PEACEMAKER", "x": 54, "y": 675, "w": 400, "h": 20, "size": 12, "color": "#647168", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "76", "x": 1177, "y": 674, "w": 49, "h": 23, "size": 14, "color": "#647168", "weight": 700, "font": "Pretendard", "align": "right", "lineSpacing": 1.24}], "notes": "원본 65페이지\n\nN\n폼\n1/5\n숨은 옥스팜워크 보물 찾기!\n축하드입니다 ! 숨은 옥스팜위크 보물을 찾으셨군요! 후\n숨은 옥스팜워크 보물 찾기는 1인 1회만 참여 가능합니다!\n이전에 다른 보물을 잦으셔서 정보 입력을 하셨다면, 이번에는 다른\n참여자를 위해 양보해주시기 바랍니다\n앞으로 좀 더 힘을 내서 2024 옥스팜위크 무사 완주를\n응원합니다!\n2024.06.29. 오후 06:07~ 계한 없음\n숨은 옥스팜워크 보을 찾기!\n물 보관 용기의 표준이 된 옥스팜 워터버킷\"\n축하드립니다 1숨은 옥스팜위크 보물 1\n물등 그 이상의 '오스팜 위터버켓을 찾으셨네요!\n갑자기 덕친 재난 상황으로 안전하고 깨끗한 물을 구할 수 없는\n긴급구호 현장, 사람들에게 가장 먼저 제공되는 긴급구호물품은\n무엇일까요? 바로 운반식 물등처럼 보이는 '육스림\n워터버킷입니다.\n지난해부터 말리쉬, 모징비크, 잠비아, 짐비브웨 등 남아프리카\n국가들을 중심으로 188,000건의 콜레라가 발생하고 3,400명이\n사망했습니다. 콜레라는 오염된 물이나 음식을 통해 전화되는\n감염냉으로, 적절한 치료를 못할 경우 사양품이 50% 이상이\n이쁩니다.\n옥스팜은 콜레라로 인한 발수증 치료를 위해 수액과 소금을\n제공하고, 오염된 물을 정확하기 위한 영소, 깨끗한 불을 저장할\n워터버킷과 비누 등의 위생용품을 전달했습니다.\n식수•위생 전문가 옥스팜은 혁신적인 방법으로 모두를 위한 물을\n전달합니다.!\n성향과 배번호를 작성해주시고, 도착지 이번트부스로 오셔서\n선물받아가세요~!\n* 담번 필수\n1. 어떤 보물을 찾으셨나요!?\n옥스팜 손 세정대\n담반을 입력해주세력\n9. 배번호\n숫자만 입력 가능합니다.\n10. 도착지 이벤트 부스에서 선물(옴트 그래놀라) 받아가\n세요-!\n오늘 17시 전까지 도착해주셔야 합니다.\n. 네 확인했습니다!", "n": 76}, {"source": 66, "title": "기억에 남는 네 가지 순간", "section": "옥스팜 워크", "bg": "#F6F5F0", "items": [{"kind": "text", "text": "옥스팜 워크", "x": 54, "y": 36, "w": 900, "h": 30, "size": 18, "color": "#087342", "weight": 700, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "text", "text": "기억에 남는 네 가지 순간", "x": 52, "y": 89, "w": 1176, "h": 90, "size": 56, "color": "#152019", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "image", "src": "assets/image816.png", "x": 54, "y": 236, "w": 273, "h": 241, "fit": "contain"}, {"kind": "text", "text": "참가자 선물", "x": 54, "y": 510, "w": 275, "h": 49, "size": 29, "color": "#087342", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "text", "text": "커피 쿠폰, 간식,\n특별한 굿즈", "x": 54, "y": 579, "w": 278, "h": 82, "size": 23, "color": "#152019", "weight": 400, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "image", "src": "assets/image817.png", "x": 352, "y": 236, "w": 273, "h": 241, "fit": "contain"}, {"kind": "text", "text": "성취감", "x": 352, "y": 510, "w": 275, "h": 49, "size": 29, "color": "#087342", "weight": 900, "font": "Pretendard Black", "align": "left", "lineSpacing": 1.06}, {"kind": "text", "text": "구간마다 지비츠 칩,\n완주하면 메달 지비츠", "x": 352, "y": 579, "w": 278, "h": 82, "size": 23, "color": "#152019", "weight": 400, "font": "Pretendard", "align": "left", "lineSpacing": 1.24}, {"kind": "image", "src": "assets/image818.png", "x": 650, "y": 236, "w": 273, "h": 241, "fit": "contain"}, {"kind": "text", "text": "의미를 찾다", "x": 650, "y": 510, "w": 275, "h": 49, "size": 29, "colo
