function wireSuperlive(){const v=$('superlive-film');if(!v)return;v.volume=.65;v.addEventListener('play',()=>superliveButton('다시 보기',false,'replay'));v.addEventListener('ended',()=>superliveButton('다시 보기',true,'replay'));v.addEventListener('pause',()=>{if(v.isConnected&&!v.ended)superliveButton(v.dataset.mode==='hold'?'다시 보기':'이어서 재생',true,v.dataset.mode==='hold'?'replay':'resume')});v.addEventListener('error',()=>superliveButton('슈퍼라이브 영상 재생',true,'resume'));if(superliveMode==='play'&&!isPresenter){superliveMode='hold';playSuperlive(true)}else holdSuperlive(v)}
$('stage').addEventListener('click',e=>{const b=e.target.closest('#superlive-replay');if(b){$('stage').focus();playSuperlive(b.dataset.action==='replay')}});
document.addEventListener('visibilitychange',()=>{const v=$('superlive-film');if(v&&document.hidden){v.pause();superliveButton('이어서 재생',true,'resume')}});
document.addEventListener('keydown',e=>{if(e.target.id!=='superlive-film'||e.altKey||e.ctrlKey||e.metaKey||document.querySelector('dialog[open]'))return;const f=['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key),b=['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key);if(f||b){e.preventDefault();e.stopImmediatePropagation();advance(f?1:-1)}},true);
function slideContent(n,staticOnly=false){const d=slides[n];const content= d.scene==='superlive-film'?superliveContent(n,staticOnly):d.scene==='nozero-bounce'?bounceContent(d,staticOnly):d.scene==='geoje-flood-video'?floodContent(n,staticOnly):editorialContent(n,staticOnly)||story2Content(n);if(!d.tipSection)return content;return `<div class="tip-bar"><span>${String(d.tipSection.number).padStart(2,'0')} / 05</span><strong>${esc(d.tipSection.title)}</strong></div>`+content.replace('class="slide ','class="slide tip-slide ')}
function filmButton(label,show=true){const b=$('bounce-replay');if(b){b.textContent=label;b.hidden=!show}}
function seekFilmEnd(film){film.pause();const apply=()=>{if(film.isConnected&&film.dataset.mode==='hold'&&Number.isFinite(film.duration))film.currentTime=Math.max(0,film.duration-.06)};if(film.readyState)apply();else film.addEventListener('loadedmetadata',apply,{once:true});filmButton('다시 보기')}
function playFilm(film,replay=false){if(!film?.isConnected)return;film.dataset.mode='play';if(replay){try{film.currentTime=0}catch{}}film.muted=false;filmButton('영상 재생',false);const attempt=film.play();attempt?.catch(()=>{if(film.isConnected&&!film.ended)filmButton('영상 재생')})}
function bounceMessage(action){const film=$('opening-film');if(!film)return;if(action==='deactivate'){film.pause();film.removeAttribute('src');film.load()}else if(action==='pause')film.pause();else if(action==='seek-end'){film.dataset.mode='hold';seekFilmEnd(film)}else if(action==='replay')playFilm(film,true);else if(action==='activate')playFilm(film)}
function wireBounce(){const film=$('opening-film');if(!film)return;film.addEventListener('play',()=>{bouncePlayed=true;filmButton('다시 보기',false)});film.addEventListener('ended',()=>filmButton('다시 보기'));film.addEventListener('error',()=>filmButton('영상 다시 열기'));if(bouncePlayed){film.dataset.mode='hold';seekFilmEnd(film)}else if(matchMedia('(prefers-reduced-motion: reduce)').matches){film.pause();filmButton('영상 재생')}else playFilm(film)}
document.addEventListener('visibilitychange',()=>bounceMessage(document.hidden?'pause':'seek-end'));
$('stage').addEventListener('click',e=>{if(e.target.closest('#bounce-replay')){$('stage').focus();bounceMessage('replay')}if(e.target.closest('[data-open-geoje]')){e.preventDefault();$('geoje-frame').src='assets/geoje-news/index.html?embed=1';$('geoje-dialog').showModal()}});
$('stage').addEventListener('click',e=>{if(!e.target.closest('[data-record-open]'))return;const item=slides[index];$('context-zoom-body').style.setProperty('--zoom-image-width',item.imageWidth+'px');$('context-zoom-image').src=item.image;$('context-zoom-image').alt=item.imageAlt;$('context-heading').textContent='400번째 실제 필드까지의 기록';$('context-zoom-body').classList.remove('is-original');$('context-zoom-toggle').textContent='원본 크기';$('context-dialog').showModal()});
$('context-close').addEventListener('click',closeContextZoom);$('context-dialog').addEventListener('cancel',e=>{e.preventDefault();closeContextZoom()});$('context-dialog').addEventListener('close',()=>$('stage').focus());$('context-zoom-toggle').addEventListener('click',()=>{const original=$('context-zoom-body').classList.toggle('is-original');$('context-zoom-toggle').textContent=original?'화면에 맞춤':'원본 크기'});
document.addEventListener('keydown',e=>{if(!$('context-dialog').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('button,a')&&[' ','Enter'].includes(e.key))return;const f=['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key),b=['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key);if(f||b){e.preventDefault();e.stopImmediatePropagation();$('context-dialog').close();advance(f?1:-1)}},true);
function closeGeoje(){if($('geoje-dialog').open)$('geoje-dialog').close()}
$('geoje-close').addEventListener('click',closeGeoje);$('geoje-dialog').addEventListener('close',()=>{$('geoje-frame').src='about:blank';$('stage').focus()});
window.addEventListener('message',e=>{const frame=$('geoje-frame');if(e.source===frame.contentWindow&&(location.origin==='null'||e.origin===location.origin)&&e.data?.type==='nozero-geoje-close')closeGeoje()});
let floodPlayed=false;
const floodMovieURL='https://hub.presence.co.kr/education/mentality/nozero400/assets/geoje-flood/geoje-flood-field.mp4';
function floodContent(n,staticOnly=false){const d=slides[n],still=staticOnly||isPresenter||!d.movie;return `<article class="slide ed ed-flood" aria-label="${esc(d.title)}"><h2>${esc(d.screen).replaceAll('\n','<br>')}</h2><div class="ed-flood-media">${still?`<img src="${esc(d.poster)}" alt="빗물이 차오른 거제 수해 현장의 실제 영상 정지화면">`:`<video id="flood-film" src="${esc(d.movie)}" poster="${esc(d.poster)}" controls playsinline preload="metadata" tabindex="0" aria-label="거제 수해 현장 영상"></video><button type="button" id="flood-replay">${floodPlayed?'다시 보기':'현장 영상 재생'}</button>`}</div><div class="ed-flood-links">${staticOnly?`<a href="${floodMovieURL}" target="_blank" rel="noopener">영상 보기 ↗</a>`:''}<a data-open-geoje href="https://hub.presence.co.kr/education/mentality/nozero400/assets/geoje-news/index.html" target="_blank" rel="noopener">거제 폭우 뉴스·지도 보기 ↗</a></div><span class="ed-page" aria-hidden="true">${String(n+1).padStart(2,'0')}</span></article>`}
function floodButton(label,show=true){const b=$('flood-replay');if(b){b.hidden=!show;b.textContent=label}}
async function playFlood(replay=false){const v=$('flood-film');if(!v)return;try{if(replay)v.currentTime=0;v.muted=false;v.volume=.35;await v.play();floodPlayed=true;floodButton('다시 보기',false)}catch{floodButton('현장 영상 재생')}}
function holdFlood(v){const seek=()=>{v.pause();try{if(Number.isFinite(v.duration))v.currentTime=Math.max(0,v.duration-.06)}catch{}floodButton('다시 보기')};if(v.readyState>=1)seek();else v.addEventListener('loadedmetadata',seek,{once:true})}
function wireFlood(){const v=$('flood-film');if(!v)return;v.volume=.35;v.addEventListener('play',()=>{floodPlayed=true;floodButton('다시 보기',false)});v.addEventListener('ended',()=>floodButton('다시 보기'));v.addEventListener('error',()=>floodButton('현장 영상 다시 열기'));if(floodPlayed)holdFlood(v);else if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&navigator.userActivation?.isActive)playFlood();else floodButton('현장 영상 재생')}
function cleanupFlood(){const v=$('flood-film');if(v){v.pause();v.removeAttribute('src');v.load()}}
$('stage').addEventListener('click',e=>{if(e.target.closest('#flood-replay')){$('stage').focus();playFlood(true)}});
document.addEventListener('keydown',e=>{if(e.target.id!=='flood-film'||e.altKey||e.ctrlKey||e.metaKey||document.querySelector('dialog[open]'))return;const f=['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key),b=['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key);if(f||b){e.preventDefault();e.stopImmediatePropagation();advance(f?1:-1)}},true);
document.addEventListener('visibilitychange',()=>{const v=$('flood-film');if(!v)return;if(document.hidden)v.pause();else holdFlood(v)});
function noteParagraphs(text){return text.split(/\n\s*\n/).map(p=>`<p${p.trim().startsWith('[')?' class="cue"':''}>${esc(p).replaceAll('\n','<br>')}</p>`).join('')}
function noteHTML(n){const s=slides[n];return `<p class="note-meta">${n+1} / ${count} · 이 장 ${s.time} · 진행 ${duration(s.offset)}–${duration(s.offset+s.seconds)} · 전체 ${duration(total)}</p>${noteParagraphs(s.notes)}`}
function draw(broadcast=true){if(slides[index].scene==='first-score-context')contextPage=phase;bounceMessage('deactivate');cleanupFlood();cleanupSuperlive();document.body.classList.toggle('has-exercise',index===exerciseIndex);$('stage').innerHTML=slideContent(index);wireBounce();wireFlood();wireSuperlive();syncContextZoom();$('stage').setAttribute('aria-label',`${index+1} / ${count} · ${slides[index].title}`);$('pages').value=String(index);$('counter').textContent=`${index+1} / ${count}`;$('previous').disabled=index===0&&phase===0;$('next').disabled=index===lastIndex&&phase===phaseMax(index);$('previous').setAttribute('aria-label',phase>0?'이전 내용 보기':'이전 슬라이드');$('next').setAttribute('aria-label',phase<phaseMax(index)?'다음 내용 보기':'다음 슬라이드');$('progress').style.width=`${(index+1)/count*100}%`;document.title=`${index+1}/${count} · NoZero 400 Days`;history.replaceState(null,'',location.pathname+location.search+'#slide-'+(index+1));$('exercise-timer').hidden=index!==exerciseIndex;$('film-music-credit').hidden=slides[index].scene!=='nozero-bounce';$('superlive-download').hidden=slides[index].scene!=='superlive-film';if(index!==exerciseIndex)stopTimer();$('note-heading').textContent=slides[index].title;$('note-body').innerHTML=noteHTML(index);$('presenter-notes').innerHTML=`<p class="eyebrow">발표자 화면</p><h2>${esc(slides[index].title)}</h2>${noteHTML(index)}<p class="status">${index<lastIndex?'다음 장 · '+esc(slides[index+1].title):'발표 마지막 장'}<br>청중 화면과 페이지가 함께 이동합니다.</p>`;if(broadcast)channel?.postMessage({type:'slide',index,phase,contextPage,sender:identity});}
const phaseMax=n=>['rookie-reveal','skill-step','superlive-film'].includes(slides[n].scene)?1:0;
function move(next,nextPhase=0){index=Math.min(lastIndex,Math.max(0,next));phase=Math.min(phaseMax(index),Math.max(0,nextPhase));contextPage=slides[index].scene==='first-score-context'?phase:0;draw()}
function advance(direction){if(direction>0&&phase<phaseMax(index)){phase++;if(slides[index].scene==='superlive-film')superliveMode='play';draw();return}if(direction<0&&phase>0){phase--;draw();return}const next=Math.min(lastIndex,Math.max(0,index+direction));move(next,direction<0&&slides[next].scene!=='superlive-film'?phaseMax(next):0)}
function stopTimer(){clearInterval(timer);timer=null;$('timer-start').textContent=secondsLeft===40?'40초 생각하기':secondsLeft===0?'다시 시작':'이어서 시작'}
function timerDisplay(){$('timer-value').textContent='00:'+String(secondsLeft).padStart(2,'0');$('timer-value').removeAttribute('aria-label')}
$('timer-start').addEventListener('click',()=>{if(timer){stopTimer();return}if(secondsLeft===0)secondsLeft=40;$('timer-start').textContent='잠깐 멈춤';timerDisplay();timer=setInterval(()=>{secondsLeft--;timerDisplay();if(secondsLeft===0){stopTimer();$('timer-value').setAttribute('aria-label','40초 생각 시간이 끝났습니다')}},1000)});$('timer-reset').addEventListener('click',()=>{stopTimer();secondsLeft=40;timerDisplay();$('timer-start').textContent='40초 생각하기'});
$('pages').innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</option>`).join('');$('pages').addEventListener('change',e=>move(+e.target.value));$('previous').addEventListener('click',()=>advance(-1));$('next').addEventListener('click',()=>advance(1));
$('notes').addEventListener('click',()=>$('note-dialog').showModal());$('note-close').addEventListener('click',()=>$('note-dialog').close());$('overview').addEventListener('click',()=>$('outline-dialog').showModal());$('outline-close').addEventListener('click',()=>$('outline-dialog').close());$('outline-heading').textContent=`${count}장 발표 목차`;$('outline-body').innerHTML=slides.map((s,i)=>`<button type="button" data-index="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}<small>${s.time}</small></button>`).join('');$('outline-body').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b){move(+b.dataset.index);$('outline-dialog').close()}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select')||document.querySelector('dialog[open]'))return;if(e.target.closest('button,a')&&[' ','Enter'].includes(e.key))return;if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();advance(1)}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();advance(-1)}else if(e.key==='Home'){e.preventDefault();move(0)}else if(e.key==='End'){e.preventDefault();move(lastIndex)}else if(e.key.toLowerCase()==='n'){$('note-dialog').showModal()}else if(e.key.toLowerCase()==='f')toggleFull()});
async function toggleFull(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').textContent='브라우저 전체 화면 사용'}}$('fullscreen').addEventListener('click',toggleFull);document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-pressed',String(!!document.fullscreenElement));$('fullscreen').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면'});
$('presenter').addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('presenter','1');url.searchParams.set('session',session);const view=window.open(url.href,'nozero400-presenter-'+session,'width=1400,height=900');if(!view){$('note-dialog').showModal()}else view.focus()});
try{channel=new BroadcastChannel('presence-nozero400-'+session);channel.onmessage=e=>{const m=e.data;if(m?.sender===identity)return;if(m?.type==='hello')channel.postMessage({type:'slide',index,phase,contextPage,sender:identity});else if(m?.type==='slide'&&Number.isInteger(m.index)&&m.index>=0&&m.index<count){index=m.index;phase=Math.min(phaseMax(index),Math.max(0,Number.isInteger(m.phase)?m.phase:0));contextPage=slides[index].scene==='first-score-context'?Math.max(0,Math.min(Math.ceil(slides[index].contextImages.length/contextVisibleCount())-1,Number.isInteger(m.contextPage)?m.contextPage:0)):0;if(slides[index].scene==='superlive-film')superliveMode=phase>0?'play':'hold';draw(false)}}}catch{}
if(isPresenter){document.body.classList.add('presenter');$('presenter').hidden=true;channel?.postMessage({type:'hello',sender:identity})}
$('script-download').addEventListener('click',()=>{const text=`${deck.title}\n${deck.subtitle} · ${deck.speaker} ${deck.role}\n${count}장 · 계획 시간 ${duration(total)} (참여 시간 포함, 실제 속도에 따라 조절)\n임재영의 실제 경험을 중심으로 구성한 발표 원고입니다.\n\n`+slides.map((s,i)=>`${i+1}. ${s.title} (${s.time})\n\n${s.notes}`).join('\n\n────────────────\n\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='NoZero-400Days-발표자-원고.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('print-deck').innerHTML=slides.map((s,n)=>`<section class="print-page">${slideContent(n,true)}</section>`).join('');$('print').addEventListener('click',()=>{if($('note-dialog').open)$('note-dialog').close();window.print()});
function hashIndex(){const match=location.hash.match(/^#slide-(\d+)$/);return match?Math.max(0,Math.min(lastIndex,+match[1]-1)):0}window.addEventListener('hashchange',()=>{move(hashIndex())});index=hashIndex();draw(false);document.fonts.ready.then(()=>$('stage').classList.add('fonts-ready'));
})();
