<div class="layout"><div class="audience"><main class="viewport"><section class="stage" id="stage" tabindex="0" aria-label="NoZero 400 Days 슬라이드"></section></main><nav class="chrome footer" aria-label="발표 페이지 이동"><button id="previous" type="button" aria-label="이전 장">‹</button><select id="pages" aria-label="슬라이드 선택"></select><button id="next" type="button" aria-label="다음 장">›</button><span class="counter" id="counter" aria-live="polite"></span><button id="notes" type="button" aria-label="현재 장 발표 노트">N</button><button id="overview" type="button" aria-label="전체 목차">☷</button><span class="hint">다음 키 · 방향키 · Space</span></nav><div class="timer" id="exercise-timer" hidden><output id="timer-value" aria-live="off">00:40</output><button id="timer-start" type="button">40초 생각하기</button><button id="timer-reset" type="button" aria-label="참여 타이머 초기화">초기화</button></div></div><aside class="presenter-notes" id="presenter-notes" aria-label="발표자 원고"></aside></div>
<div class="progress" id="progress"></div><div id="print-deck" class="print-deck" aria-hidden="true"></div>
<dialog id="note-dialog" aria-labelledby="note-heading"><div class="dialog-head"><h2 id="note-heading"></h2><button type="button" id="note-close" aria-label="발표 노트 닫기">닫기</button></div><div class="dialog-body" id="note-body"></div><div class="dialog-actions"><button id="script-download" type="button">전체 발표 원고 받기</button><a href="NoZero-400Days.pptx?v=20261123-nozero400-story2" download>PPTX 받기</a><a href="NoZero-400Days.pdf?v=20261123-nozero400-story2" download>PDF 받기</a><button id="print" type="button">직접 인쇄하기</button></div></dialog>
<dialog id="outline-dialog" aria-labelledby="outline-heading"><div class="dialog-head"><h2 id="outline-heading">15장 발표 목차</h2><button type="button" id="outline-close" aria-label="목차 닫기">닫기</button></div><div class="dialog-body outline" id="outline-body"></div></dialog>
<noscript><p>이 발표를 보려면 자바스크립트를 켜 주세요.</p></noscript>
<script src="deck-data.js?v=20261123-nozero400-story2"></script>
<script>
(()=>{
'use strict';
const deck=window.NOZERO400,slides=deck.slides,$=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search),isPresenter=params.get('presenter')==='1',session=params.get('session')||(crypto.randomUUID?crypto.randomUUID():String(Date.now())),identity=Math.random().toString(36).slice(2);let index=0,channel=null,timer=null,secondsLeft=40;
const duration=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;const total=slides.reduce((n,s)=>n+s.seconds,0);let elapsed=0;for(const slide of slides){slide.offset=elapsed;elapsed+=slide.seconds}
const eyebrow=t=>`<p class="eyebrow">${t}</p>`,wrap=(cls,body)=>`<article class="slide ${cls}" aria-label="${esc(slides[index]?.title||'')}">${body}</article>`;
function storyText(s,text){let out=esc(text);for(const phrase of [...(s.emphasis||[])].sort((a,b)=>b.length-a.length)){out=out.replaceAll(esc(phrase),`<span class="accent">${esc(phrase)}</span>`)}return out.replaceAll('\n','<br>')}
function slideContent(n){const s=slides[n];if(n===0)return `<article class="slide cover" aria-label="${esc(s.title)}">${eyebrow('NOZERO 400 DAYS')}<h1>${storyText(s,s.screen)}</h1><p class="byline">${esc(deck.speaker)}<span>SALESWORKS · ${esc(deck.role)}</span></p><div class="big-number" aria-hidden="true">400</div></article>`;const paragraphs=s.screen.split(/\n\s*\n/).map((text,i)=>`<p class="story-line group-${i}">${storyText(s,text)}</p>`).join('');const body=`<div class="story-copy"><h2 class="visually-hidden">${esc(s.title)}</h2>${eyebrow(esc(s.kicker))}<div class="story-body">${paragraphs}</div></div>`;return `<article class="slide story story-${esc(s.layout)}" aria-label="${esc(s.title)}">${body}${s.image?`<figure class="story-photo"><img src="${esc(s.image)}" alt="${esc(s.imageAlt)}" width="1495" height="1052"><figcaption>${esc(s.caption)}</figcaption></figure>`:''}</article>`}
function noteParagraphs(text){return text.split(/\n\s*\n/).map(p=>`<p${p.trim().startsWith('[')?' class="cue"':''}>${esc(p).replaceAll('\n','<br>')}</p>`).join('')}
function noteHTML(n){const s=slides[n];return `<p class="note-meta">${n+1} / 15 · 이 장 ${s.time} · 진행 ${duration(s.offset)}–${duration(s.offset+s.seconds)} · 전체 약 20분</p>${noteParagraphs(s.notes)}`}
function draw(broadcast=true){document.body.classList.toggle('has-exercise',index===12);$('stage').innerHTML=slideContent(index);$('stage').setAttribute('aria-label',`${index+1} / 15 · ${slides[index].title}`);$('pages').value=String(index);$('counter').textContent=`${index+1} / 15`;$('previous').disabled=index===0;$('next').disabled=index===14;$('progress').style.width=`${(index+1)/15*100}%`;document.title=`${index+1}/15 · NoZero 400 Days`;history.replaceState(null,'',location.pathname+location.search+'#slide-'+(index+1));$('exercise-timer').hidden=index!==12;if(index!==12)stopTimer();$('note-heading').textContent=slides[index].title;$('note-body').innerHTML=noteHTML(index);$('presenter-notes').innerHTML=`<p class="eyebrow">발표자 화면</p><h2>${esc(slides[index].title)}</h2>${noteHTML(index)}<p class="status">${index<14?'다음 장 · '+esc(slides[index+1].title):'발표 마지막 장'}<br>청중 화면과 페이지가 함께 이동합니다.</p>`;if(broadcast)channel?.postMessage({type:'slide',index,sender:identity});}
function move(next){index=Math.min(14,Math.max(0,next));draw()}
function stopTimer(){clearInterval(timer);timer=null;$('timer-start').textContent=secondsLeft===40?'40초 생각하기':secondsLeft===0?'다시 시작':'이어서 시작'}
function timerDisplay(){$('timer-value').textContent='00:'+String(secondsLeft).padStart(2,'0');$('timer-value').removeAttribute('aria-label')}
$('timer-start').addEventListener('click',()=>{if(timer){stopTimer();return}if(secondsLeft===0)secondsLeft=40;$('timer-start').textContent='잠깐 멈춤';timerDisplay();timer=setInterval(()=>{secondsLeft--;timerDisplay();if(secondsLeft===0){stopTimer();$('timer-value').setAttribute('aria-label','40초 생각 시간이 끝났습니다')}},1000)});$('timer-reset').addEventListener('click',()=>{stopTimer();secondsLeft=40;timerDisplay();$('timer-start').textContent='40초 생각하기'});
$('pages').innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</option>`).join('');$('pages').addEventListener('change',e=>move(+e.target.value));$('previous').addEventListener('click',()=>move(index-1));$('next').addEventListener('click',()=>move(index+1));
$('notes').addEventListener('click',()=>$('note-dialog').showModal());$('note-close').addEventListener('click',()=>$('note-dialog').close());$('overview').addEventListener('click',()=>$('outline-dialog').showModal());$('outline-close').addEventListener('click',()=>$('outline-dialog').close());$('outline-body').innerHTML=slides.map((s,i)=>`<button type="button" data-index="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}<small>${s.time}</small></button>`).join('');$('outline-body').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b){move(+b.dataset.index);$('outline-dialog').close()}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select')||document.querySelector('dialog[open]'))return;if(e.target.closest('button,a')&&[' ','Enter'].includes(e.key))return;if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();move(index+1)}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();move(index-1)}else if(e.key==='Home'){e.preventDefault();move(0)}else if(e.key==='End'){e.preventDefault();move(14)}else if(e.key.toLowerCase()==='n'){$('note-dialog').showModal()}else if(e.key.toLowerCase()==='f')toggleFull()});
async function toggleFull(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').textContent='브라우저 전체 화면 사용'}}$('fullscreen').addEventListener('click',toggleFull);document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-pressed',String(!!document.fullscreenElement));$('fullscreen').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면'});
$('presenter').addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('presenter','1');url.searchParams.set('session',session);const view=window.open(url.href,'nozero400-presenter-'+session,'width=1400,height=900');if(!view){$('note-dialog').showModal()}else view.focus()});
try{channel=new BroadcastChannel('presence-nozero400-'+session);channel.onmessage=e=>{const m=e.data;if(m?.sender===identity)return;if(m?.type==='hello')channel.postMessage({type:'slide',index,sender:identity});else if(m?.type==='slide'&&Number.isInteger(m.index)&&m.index>=0&&m.index<15){index=m.index;draw(false)}}}catch{}
if(isPresenter){document.body.classList.add('presenter');$('presenter').hidden=true;channel?.postMessage({type:'hello',sender:identity})}
$('script-download').addEventListener('click',()=>{const text=`${deck.title}\n${deck.subtitle} · ${deck.speaker} ${deck.role}\n15장 · 계획 시간 ${duration(total)} (참여 시간 포함, 실제 속도에 따라 조절)\n임재영의 실제 경험을 중심으로 구성한 발표 원고입니다.\n\n`+slides.map(s=>`${s.n}. ${s.title} (${s.time})\n\n${s.notes}`).join('\n\n────────────────\n\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='NoZero-400Days-발표자-원고.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('print-deck').innerHTML=slides.map((s,n)=>`<section class="print-page">${slideContent(n)}</section>`).join('');$('print').addEventListener('click',()=>{if($('note-dialog').open)$('note-dialog').close();window.print()});
function hashIndex(){const match=location.hash.match(/^#slide-(\d+)$/);return match?Math.max(0,Math.min(14,+match[1]-1)):0}window.addEventListener('hashchange',()=>{index=hashIndex();draw()});index=hashIndex();draw(false);document.fonts.ready.then(()=>$('stage').classList.add('fonts-ready'));
})();
</script>
</body>
</html>
