*{box-sizing:border-box}html,body{margin:0;background:#101917;color:#fff;font-family:Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif}button,a{font:inherit}button{min-width:44px;min-height:44px;border:1px solid #ffffff66;border-radius:0;color:inherit;background:#101917e8;padding:10px 14px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ffb499;outline-offset:3px}button:disabled{opacity:.35;cursor:default}[hidden]{display:none!important}.toolbar{height:64px;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff25}.toolbar strong{font-size:17px}.toolbar small{font-size:12px;color:#baccc1;margin-left:12px}.toolbar button{background:transparent}.map-scene{position:relative;isolation:isolate;height:calc(100dvh - 132px);min-height:500px;overflow:hidden;background:#cfd7d1}.base-map{position:absolute;inset:-2%;width:104%;height:104%;border:0;pointer-events:none;filter:saturate(.62) contrast(1.02) brightness(.9)}.soft-edge{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#070a0bc9,transparent 28%,transparent 78%,#070a0b55)}.simple-head{position:absolute;z-index:3;left:4%;top:4%;pointer-events:none}.simple-head small{font-size:12px;letter-spacing:.12em;color:#ffb499}.simple-head h1{font-size:clamp(27px,3.3vw,46px);line-height:1.16;letter-spacing:-.045em;margin:12px 0}.home-core{position:absolute;z-index:8;left:58%;top:59%;display:flex;align-items:center;gap:13px;pointer-events:none}.home-core i{width:18px;height:18px;border-radius:50%;background:#2879ee;border:3px solid #fff;box-shadow:0 0 0 12px #2879ee44}.home-core b{background:#fff;color:#182e2c;padding:10px 14px;box-shadow:0 6px 20px #0005;font-size:16px;white-space:nowrap}.home-core.highlight i{box-shadow:0 0 0 18px #2879ee66}.home-core.highlight b{outline:3px solid #2879ee}.clip{position:absolute;z-index:5;width:clamp(155px,15.5vw,230px);min-height:120px;border:0;padding:0;background:#101917;color:#fff;box-shadow:0 9px 30px #0007;transform:translate(-50%,-50%);cursor:pointer;text-align:left}.clip:hover{z-index:10;outline:2px solid #ffb499}.clip img{display:block;aspect-ratio:16/9;width:100%;height:auto;object-fit:cover}.clip .copy{display:block;padding:9px 11px}.clip small,.clip b{display:block}.clip small{font-size:11px;color:#c4d3c8;margin-bottom:4px}.clip b{font-size:14px;line-height:1.25;word-break:keep-all}.clip .play{position:absolute;right:8px;top:8px;background:#101917dc;padding:5px 8px;font-size:12px}.clip.exact{outline:1px solid #c84b34}.presentation-controls{height:68px;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 20px;background:#101917}.presentation-controls output{font-size:14px;min-width:210px;text-align:center;color:#d5e0d8}.cinema{position:fixed;z-index:20;inset:64px 0 68px;background:#08100ef5;display:flex;align-items:center;justify-content:center;padding:28px}.cinema-inner{width:min(100%,calc((100dvh - 220px)*16/9));outline:0}.cinema iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}.cinema-caption{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0 0}.cinema-caption p{margin:0}.cinema-caption small{display:block;font-size:12px;color:#b7c8bd;margin-bottom:5px}.cinema-caption strong{font-size:20px;line-height:1.35}.cinema-caption a{font-size:13px;color:#d9e5dd;min-height:44px;display:flex;align-items:center;white-space:nowrap}.source-note{font-size:12px;color:#baccc1}.map-note{position:absolute;left:4%;bottom:3%;z-index:3;font-size:12px;background:#101917e8;color:#fff;padding:8px 10px;max-width:52%;line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:700px){.toolbar{height:auto;min-height:64px;padding:10px 16px}.toolbar strong{font-size:16px}.toolbar small{display:none}.map-scene{height:auto;min-height:0;overflow:visible;padding:320px 16px 26px;display:grid;grid-template-columns:1fr;gap:18px}.base-map{inset:0;width:100%;height:300px}.soft-edge{height:300px}.simple-head{left:20px;top:20px}.simple-head small{font-size:11px}.simple-head h1{font-size:26px;max-width:230px}.home-core{left:52%;top:206px;gap:9px}.home-core b{font-size:13px;padding:9px 10px}.home-core i{width:15px;height:15px;box-shadow:0 0 0 9px #2879ee44}.clip{position:relative;left:auto!important;top:auto!important;width:100%;min-height:44px;transform:none}.clip img{aspect-ratio:16/9}.clip .copy{padding:13px 14px}.clip small{font-size:12px}.clip b{font-size:17px}.map-note{position:relative;left:auto;bottom:auto;max-width:none;margin:0;font-size:12px}.presentation-controls{position:sticky;bottom:0;z-index:30;height:72px;gap:8px;padding:10px 12px}.presentation-controls output{font-size:12px;min-width:0;flex:1}.presentation-controls button{padding:8px 10px;font-size:13px}.cinema{inset:64px 0 72px;padding:16px}.cinema-inner{width:100%}.cinema-caption{display:block;padding-top:14px}.cinema-caption strong{font-size:19px}.cinema-caption a{margin-top:12px}.toolbar .close{font-size:13px}.toolbar strong{display:block;max-width:230px}}
.simple-head{display:none}.toolbar strong{font-size:clamp(15px,1.6vw,22px);line-height:1.35}.toolbar small{display:block;margin-left:0;margin-top:3px;font-size:11px}.toolbar>div{min-width:0}.toolbar .close{flex-shrink:0}@media(max-width:700px){.toolbar strong{font-size:14px}.toolbar small{font-size:10px;display:block}.toolbar{gap:10px}.toolbar .close{padding:8px;font-size:11px;max-width:110px}.map-scene{padding-top:320px}}

.clip[data-clip="0"]{margin-top:100px}@media(max-width:700px){.clip[data-clip="0"]{margin-top:0}}
</style></head><body>
<header class="toolbar"><div><strong>그날 새벽, 주위에서 일어나고 있던 일들.</strong><small>2026.08.17 · 거제 옥포</small></div><button class="close" id="close" type="button">발표로 돌아가기 ×</button></header>
<main class="map-scene" id="map-scene" aria-label="거제 옥포의 당시 뉴스와 내가 있던 곳"><iframe class="base-map" title="거제 옥포 주변 지도" src="https://www.openstreetmap.org/export/embed.html?bbox=128.683%2C34.886%2C128.700%2C34.902&layer=mapnik" loading="lazy"></iframe><div class="soft-edge"></div><header class="simple-head"><small>2026.08.17 · GEOJE, OKPO</small><h1>그날 새벽,<br>주위에서 일어나고 있던 일들.</h1></header><div class="home-core" id="home-core"><i aria-hidden="true"></i><b>내가 있던 곳</b></div><div id="clips"></div><p class="map-note">한파와는 별개의 경험입니다. 당시 뉴스의 보도 위치와 내가 있던 곳을 함께 봅니다.</p></main>
<section class="cinema" id="cinema" hidden aria-label="선택한 뉴스 영상"><div class="cinema-inner" id="cinema-inner" tabindex="-1"><div id="player"></div><div class="cinema-caption"><p><small id="source"></small><strong id="clip-title"></strong></p><a id="youtube-link" target="_blank" rel="noopener noreferrer">YouTube에서 열기 ↗</a></div></div></section>
<nav class="presentation-controls" aria-label="뉴스 자료 이동"><button id="previous" type="button">← 이전</button><output id="counter" aria-live="polite">지도 · 뉴스 6개</output><button id="next" type="button">다음 뉴스 →</button></nav><p class="sr-only" id="status" role="status"></p>
<script>
(()=>{'use strict';
document.documentElement.classList.toggle('embedded',new URLSearchParams(location.search).has('embed'));
const clips=[{id:'_Tkz9ykQObQ',title:'최가두부 앞 침수',source:'시민 제보',x:64,y:64,exact:true},{id:'g6nEjrbfmD4',title:'최가두부·옥포 상가 급류',source:'YTN 제보영상',x:71,y:47,exact:true},{id:'cv9wPFFsi38',title:'옥포 침수 원인 추적',source:'경남신문',x:53,y:28,exact:false},{id:'O4VlZTMc6oY',title:'대원아파트 산사태 현장',source:'KBS 뉴스',x:28,y:31,exact:true},{id:'cCA4VEUOz8Y',title:'제보로 본 옥포 폭우',source:'YTN',x:27,y:62,exact:false},{id:'T8xWho5l2X4',title:'거제 침수·범람 현장',source:'KBS 뉴스',x:47,y:75,exact:false}];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=-1;
$('clips').outerHTML=clips.map((c,i)=>`<button type="button" class="clip ${c.exact?'exact':''}" style="left:${c.x}%;top:${c.y}%" data-clip="${i}" aria-label="${esc(c.title)} 재생"><img src="https://i.ytimg.com/vi/${c.id}/hqdefault.jpg" alt="" loading="lazy"><span class="copy"><small>${esc(c.source)}</small><b>${esc(c.title)}</b></span><span class="play">재생 ▶</span></button>`).join('');
function stop(){$('player').replaceChildren();$('cinema').hidden=true}
function close(){stop();if(parent!==window)parent.postMessage({type:'nozero-geoje-close'},location.origin==='null'?'*':location.origin);else location.assign('../../index.html#slide-8')}
function show(n){stop();current=Math.max(-1,Math.min(clips.length,n));$('home-core').classList.toggle('highlight',current===clips.length);$('next').textContent=current===clips.length?'발표로 돌아가기 →':'다음 뉴스 →';$('previous').disabled=current===-1;$('counter').textContent=current<0?'지도 · 뉴스 6개':current===clips.length?'뉴스를 본 뒤 · 내가 있던 곳':`뉴스 ${current+1} / ${clips.length}`;
if(current>=0&&current<clips.length){const c=clips[current],frame=document.createElement('iframe');frame.src=`https://www.youtube.com/embed/${c.id}?autoplay=1&mute=0&controls=1&disablekb=1&rel=0&playsinline=1`;frame.title=c.title;frame.allow='autoplay; encrypted-media; fullscreen';frame.referrerPolicy='strict-origin-when-cross-origin';frame.tabIndex=-1;frame.allowFullscreen=true;$('player').append(frame);$('clip-title').textContent=c.title;$('source').textContent=c.source+' · 당시 보도 영상';$('youtube-link').href=`https://www.youtube.com/watch?v=${c.id}`;$('cinema').hidden=false;$('cinema-inner').focus();}else if(current===clips.length){$('home-core').scrollIntoView({block:'center',behavior:'auto'});$('status').textContent='뉴스를 본 뒤 내가 있던 곳을 지도에서 다시 봅니다.'}}
function next(){if(current===clips.length)close();else show(current+1)}function previous(){show(current-1)}
$('close').addEventListener('click',close);$('next').addEventListener('click',next);$('previous').addEventListener('click',previous);document.querySelectorAll('[data-clip]').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.clip)));
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select'))return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();return}if(e.repeat)return;if(e.target.closest('button,a')&&['Enter',' '].includes(e.key))return;const forward=['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key),backward=['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key);if(forward||backward){e.preventDefault();e.stopPropagation();forward?next():previous()}});
window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='nozero-geoje'&&e.data.action==='deactivate')stop()});
show(-1);
})();
</script></body></html>
