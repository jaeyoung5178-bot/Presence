<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11151c"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Presence 리캡</title>
<link rel="stylesheet" href="assets/recap-keynote/recap-v2.css?v=20261011-direct">
</head><body class="share-mode">
<div id="login" class="login-screen"><div class="login-card"><span class="brand"><span class="brand-mark">P</span> Presence <small>TEAM RECAP</small></span><h1>리캡 공유</h1><p id="loginMsg" class="hint" role="status">공유된 리캡을 불러오는 중…</p><form id="loginForm" hidden><input id="loginId"><input id="loginPw" type="password"><button type="submit">열기</button></form></div></div>
<div id="app" hidden><header class="topbar"><span class="brand"><span class="brand-mark">P</span><span>Presence <small>TEAM RECAP</small></span></span><div class="document-title"><span id="docName">Team recap</span><small id="saveStatus" role="status" hidden></small></div><div class="toolbar"><label class="month-control" hidden><span class="sr-only">리캡 월</span><input id="month" type="month" disabled></label><button data-action="present" class="primary">▶ 발표</button><button data-action="menu" hidden aria-hidden="true" tabindex="-1">•••</button></div><div id="docMenu" class="doc-menu" hidden></div></header>
<div class="workspace"><aside class="chapter-rail" aria-label="리캡 챕터"><div class="rail-label">MONTHLY CHAPTERS</div><nav id="chapters"></nav></aside><main class="main-stage"><div class="stage-toolbar"><div><span class="eyebrow" id="chapterLabel"></span><div id="subnav" class="subnav" aria-label="챕터 페이지"></div></div></div><div id="notice" class="notice" hidden></div><div id="canvas" class="canvas" aria-live="polite"></div><footer class="stage-footer"><span id="pageCount"></span><div><button data-action="prev" aria-label="이전 페이지">←</button><button data-action="next" aria-label="다음 페이지">→</button></div></footer></main><aside id="inspector" class="inspector" hidden><div id="editor"></div></aside></div>

<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button data-action="close-dialog" aria-label="닫기">×</button></div><form id="dialogForm"><div id="dialogBody"></div><footer><button type="button" data-action="close-dialog">닫기</button><button type="submit" class="primary" hidden>적용</button></footer></form></dialog><input id="importFile" type="file" hidden><div id="toast" class="toast" role="status"></div><script type="module" src="assets/recap-keynote/app.js?v=20261011-direct"></script></body></html>
